        with:
          path: repo/work/ocr-cache
          key: ocr-pool-aocai-sh${{ matrix.shard }}-v4-${{ github.run_id }}
          restore-keys: |
            ocr-pool-aocai-sh${{ matrix.shard }}-v4-
      - name: 把两层缓存铺回各 .cache 目录
        working-directory: repo
        run: |
          PERIOD="${{ steps.period.outputs.period }}"
          mkdir -p "work/meta-cache/$PERIOD" work/ocr-cache/ocr
          # ⚠ 2026-11-21 根因修复（run 44906863761 实测「铺回 0 个 .cache」）：
          #   分片刚启动时 work/out 是空的（还没跑采集 → 没有期目录 → 没有 .cache）
          #   → find 返回 0 个目录 → 缓存一个都没铺进去
          #   → OCR 结果留在 work/ocr-cache/ocr/ 但没人读
          #   → 采集时全部重新 OCR → 2030 图 × 1 秒 = 34 分钟 → SIGTERM
          #   修法：先按「源+期号」预建期目录和 .cache/ocr，再铺回。
          SRC="aocai"
          SUB="澳彩交流"
          # 期号可能是 2026325 或 325，两种目录名都建（同一个位置，取短的）
          P3=$(echo "$PERIOD" | sed 's/^2026//')
          [ -z "$P3" ] && P3="$PERIOD"
          mkdir -p "work/out/$SUB/澳门_2026_${P3}期/.cache/ocr"
          n=0
          for d in $(find work/out -type d -name .cache 2>/dev/null); do
            [ -d "$d" ] || continue
            cp -n "work/meta-cache/$PERIOD/"*.json "$d/" 2>/dev/null || true
            mkdir -p "$d/ocr"
            cp -n work/ocr-cache/ocr/*.json "$d/ocr/" 2>/dev/null || true
            n=$((n+1))
          done
          echo "铺回 $n 个 .cache（meta 期号=$PERIOD / OCR $(ls work/ocr-cache/ocr 2>/dev/null | wc -l) 个文件）"
          echo "预建目录：work/out/$SUB/澳门_2026_${P3}期/.cache/ocr ($(ls work/out/$SUB/澳门_2026_${P3}期/.cache/ocr 2>/dev/null | wc -l) 个)"
      - name: 分片预热（只处理本片：详情+回复+图片+OCR）
        id: shard
        working-directory: repo
        env:
          NO_OCR: ${{ github.event.inputs.no_ocr || 'false' }}
          NO_IMAGES: ${{ github.event.inputs.no_images || 'false' }}
          # OCR 进程数（2026-11-20 A/B 验证）：1=串行（安全），2=双进程（1.40x，需 core/ocr.py 的 fork reset 修复）
          QODE_OCR_PROCS: ${{ github.event.inputs.ocr_procs || '2' }}
        run: |
          set -o pipefail
          # SIGTERM 优雅投降（2026-11-19）：1200s(20 分) 远小于 job timeout 1500s(25 分)
          # ⚠ 2026-11-19 实测教训：原写 1440s(24 分)，但 timeout 是**相对本 step 开始**算的，
          #   而前置步骤（检出/装依赖/恢复缓存）占 ~1 分钟 → 1+24 ≈ 25 = job timeout，两者竞争，
          #   有时 job timeout 先 SIGKILL → handler 没机会跑（日志里连「收到 SIGTERM」都没有）。
          #   改成 1200s(20 分) → 1+20 = 21 分 < 25 分，稳。分片容量 15 分钟（USABLE_RATIO=0.6）也够。
          # --kill-after=30：若 SIGTERM 30 秒内没退，再 SIGKILL 兜底。
          SHARD_TO="timeout --signal=SIGTERM --kill-after=30 1200"
          EXTRA=""
          [ "$NO_OCR" = "true" ] && EXTRA="$EXTRA --no-ocr"
          [ "$NO_IMAGES" = "true" ] && EXTRA="$EXTRA --no-images"
          set +e
          $SHARD_TO python -m cloud.runner --shard "${{ matrix.shard }}" \
            --shards "${{ needs.plan.outputs.count_aocai }}" \
            --source "aocai" --work work --out work/out --workers 8 \
            $EXTRA 2>&1 | tee "work/shard_aocai_${{ matrix.shard }}.log"
            code=$?
            set -e
            if [ "$code" -eq 124 ] || [ "$code" -eq 143 ]; then
              echo "::warning::分片被 SIGTERM（24 分钟预算用完）→ 按优雅退出处理（unfinished 已由 runner 写出）"
              exit 0
            fi
            exit $code
      - name: 收集两层缓存（meta 按期 / OCR 跨期）
        if: always()
        working-directory: repo
        run: |
          PERIOD="${{ steps.period.outputs.period }}"
          mkdir -p "work/meta-cache/$PERIOD" work/ocr-cache/ocr
          for d in $(find work/out -type d -name .cache 2>/dev/null); do
            [ -d "$d" ] || continue
            cp -f "$d"/*.json "work/meta-cache/$PERIOD/" 2>/dev/null || true
            cp -f "$d"/ocr/*.json work/ocr-cache/ocr/ 2>/dev/null || true
          done
          echo "meta($PERIOD): $(ls work/meta-cache/$PERIOD 2>/dev/null | wc -l) 个；ocr: $(ls work/ocr-cache/ocr 2>/dev/null | wc -l) 个"
      - name: 缓存体积检查（超 500MB 才瘦身）
        if: always()
        working-directory: repo
        run: |
          # 方案 3 改动 4：分片 artifact **保留图片**（约 200MB/片），
          # 让 merge 直接合并、不重新下载（实测重下会把合并从 12 分拖到 15 分）。
          # 安全网：存缓存前量一下体积，超过 500MB 才删图片，防止某期图片暴增打爆 10GB 额度。
          size_mb=$(du -sm work/out 2>/dev/null | cut -f1 || echo 0)
          echo "本片输出体积：${size_mb}MB（阈值 500MB）"
          if [ "${size_mb:-0}" -gt 500 ]; then
            echo "::warning::超过 500MB，执行瘦身（只留 .cache），避免撑爆 actions/cache 额度"
            find work/out -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' \) -delete 2>/dev/null || true
            after=$(du -sm work/out 2>/dev/null | cut -f1 || echo 0)
            echo "瘦身后：${after}MB"
          else
            echo "未超阈值，图片保留在 artifact 里（merge 无需重下）"
          fi
      - name: 失败/超时诊断（写 Step Summary）
        if: failure()
        run: |
          echo "## ⏱ 失败/超时诊断" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -30 work/shard_aocai_${{ matrix.shard }}.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '\[详情\]|\[OCR\]|\[图片\]|\[shard\]' work/shard_aocai_${{ matrix.shard }}.log 2>/dev/null | tail -5 >> "$GITHUB_STEP_SUMMARY" || true
      - name: 打包本片缓存
        if: always()
        working-directory: repo
        run: |
          mkdir -p work/cacheout
          # ① 元数据/OCR 缓存（原有）
          # ⚠ 2026-11-23 主动排查修复（deepcheck_tuku_detail.py 实测）：
          #   aocai 的 threads.json、tuku 的 details.json/replies.json 会随 .cache 打包，
          #   下一轮 restore 后详情缓存跨轮生效且无 TTL → 帖子更新（新图/新文字）看不到。
          #   修法：只打 OCR 结果（按 sha256 索引，跨轮复用安全），排除详情缓存。
          ( cd work/out && find . -type d -name .cache -print0 2>/dev/null \
            | tar -czf ../../work/cacheout/cache_aocai_${{ matrix.shard }}.tar.gz --exclude='*threads.json' --exclude='*details.json' --exclude='*replies.json' --exclude='*dahkg_threads.json' --null -T - 2>/dev/null )             || echo "没有 .cache 可打包（本片可能是空片）"
          # ② 产物（C1-中 新增）：分片已经生成了 posts.json 等产物，只是之前没打包
          #    只打文本类产物，图片仍走 .cache 里的副本，避免 artifact 膨胀
          ( cd work/out && find . -maxdepth 3 -type f \
              -not -path '*/.cache/*' \
              \( -name '*.json' -o -name '*.csv' -o -name '*.html' \
                 -o -name '*.txt' -o -name '*.xlsx' -o -name '*.md' \) -print0 2>/dev/null \
            | tar -czf ../../work/cacheout/products_aocai_${{ matrix.shard }}.tar.gz --null -T - 2>/dev/null ) \
            || echo "没有产物可打包"
          echo "--- cacheout 内容 ---"
          ls -la work/cacheout
          for f in work/cacheout/products_aocai_${{ matrix.shard }}.tar.gz; do
            [ -f "$f" ] && echo "产物包 $(basename "$f"): $(du -m "$f" | cut -f1) MB / $(tar -tzf "$f" | wc -l) 个文件"
          done
      - name: 上传本片缓存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-aocai-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            repo/work/cacheout
            repo/work/shards
            repo/work/shard_aocai_${{ matrix.shard }}.log
            repo/work/unfinished
          if-no-files-found: warn

  # ---------------- 分片 tuku：#=0..1 （并行预热缓存）----------------
  shard_tuku:
    name: "分片 tuku#${{ matrix.shard }}"
    needs: [plan, prepare]
    if: contains(needs.plan.outputs.sources, 'tuku') && github.event.inputs.no_shard != 'true'
    runs-on: ubuntu-24.04
    # 硬超时保护：实测 runner CPU 异构（AMD EPYC 0.37s/图 vs Intel 6975P 1.95s/图，
    # 差 5.3 倍），慢机会把单片拖到 25 分钟以上。这里封顶 18 分钟；
    # runner 内部还有 16 分钟「软超时」：到点把剩余帖子写 unfinished_*.json 后正常退出，
    # 剩余工作交给 merge 补抓（见 runner.py 的 watchdog）。
    # 硬超时 25。分片容量由 runner 的 cloud/budget.py 按「本 job timeout × 0.6」算
    # （= 15 分钟）。为什么不是 0.9：整轮 = 固定 + 最慢分片 + merge，
    # 0.9 时 dahkg 实测 7+23.7+10 = 40.7 分撞 watchdog 40 分 → publish 被跳过。
    timeout-minutes: 25
    # 分片只是「预热缓存」，**正确性由 merge 的全量重采 + 五道防线保证**。
    # 2026-11-17 事故：跨期时若干分片报「没有 X 期的帖子」→ 整个 run 变 failure → publish 被跳过，
    # 当天数据没进数据仓。所以这里让分片失败**不连累整轮**：
    # 分片失败 = 那部分缓存没预热（merge 多花点时间重采），不影响产物正确性。
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards_tuku) }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: repo
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 安装系统依赖（opencv 需要 libGL）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: 恢复 pip 缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
