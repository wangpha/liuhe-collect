              exit 0
            fi
            exit $code
      - name: 收集两层缓存（meta 按期 / OCR 跨期）
        if: always()
        working-directory: repo
        run: |
          PERIOD="${{ steps.period.outputs.period }}"
          mkdir -p "work/meta-cache/$PERIOD" work/ocr-cache/ocr
          for d in $(find work/out -type d -name .cache 2>/dev/null); do
            [ -d "$d" ] || continue
            cp -f "$d"/*.json "work/meta-cache/$PERIOD/" 2>/dev/null || true
            cp -f "$d"/ocr/*.json work/ocr-cache/ocr/ 2>/dev/null || true
          done
          echo "meta($PERIOD): $(ls work/meta-cache/$PERIOD 2>/dev/null | wc -l) 个；ocr: $(ls work/ocr-cache/ocr 2>/dev/null | wc -l) 个"
      - name: 缓存体积检查（超 500MB 才瘦身）
        if: always()
        working-directory: repo
        run: |
          # 方案 3 改动 4：分片 artifact **保留图片**（约 200MB/片），
          # 让 merge 直接合并、不重新下载（实测重下会把合并从 12 分拖到 15 分）。
          # 安全网：存缓存前量一下体积，超过 500MB 才删图片，防止某期图片暴增打爆 10GB 额度。
          size_mb=$(du -sm work/out 2>/dev/null | cut -f1 || echo 0)
          echo "本片输出体积：${size_mb}MB（阈值 500MB）"
          if [ "${size_mb:-0}" -gt 500 ]; then
            echo "::warning::超过 500MB，执行瘦身（只留 .cache），避免撑爆 actions/cache 额度"
