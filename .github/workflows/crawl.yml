          restore-keys: |
            ocr-meta-p${{ steps.period.outputs.period }}-${{ matrix.shard }}-tuku-${{ github.event.inputs.cache_buster || '0' }}-
      # ⚠ 2026-11-21 架构修正（run 44858821213 实测教训）：
      #   上一版把缓存 save 放在 merge，结果 merge 要压缩上传 20+ 万文件，
      #   耗时 16.8 分被 Watchdog 取消 —— 和之前删掉的 ocr-merge-v3 同一坑。
      #   正确做法：**分片自己 save 自己那份**，key 带 matrix.shard → 13 片互不冲突。
