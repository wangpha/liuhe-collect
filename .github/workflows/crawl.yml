name: 六合云端采集

# 门禁纪律（文档 6B.5）：Gate 1–5 全部 ✅ 之前，schedule 段保持注释，只允许手动触发。
#
# 分片架构（v3，2026-11-16）：
#   plan → cleanup → prepare(每源 --plan) → shard_{dahkg,aocai,tuku} ×N（并行预热缓存）
#        → merge_{dahkg,aocai,tuku}（每源一次完整跑）→ publish
#
# 为什么 shard / merge 都拆成三个独立 job：
#   GitHub Actions 的 `needs` 是 job 级。若 shard 是一个含三源的 matrix job，
#   任何 merge 都必须等整个 shard 结束（含最慢的源），跨源会互相拖。
#   拆开后 aocai/tuku 的 merge 可在 dahkg 还在分片时就完成。
#
# 为什么分片只在「列表取数函数」上打补丁：
#   三源采集流程差异极大（tuku 有 details/replies/ocr 三段缓存；aocai 走
#   collect_forum_posts；dahkg 自带 collect_posts）。若逐个复刻流程，
#   任何一处顺序/参数不同都会让 merge 产物与串行版不一致 —— 而一致性正是分片要证明的。
#   现在只切列表结果，下游全部是该模块自己的代码，语义天然一致。

on:
  workflow_dispatch:
    inputs:
      source:
        description: "采集哪个源"
        required: true
        default: "tuku"
        type: choice
        options: [tuku, aocai, dahkg, all]
      no_ocr:
        description: "跳过 OCR（只抓数据，验链路用）"
        required: false
        default: false
        type: boolean
      no_images:
        description: "跳过图片下载"
        required: false
        default: false
        type: boolean
      limit:
        description: "仅抓前 N 条（0 = 全量）"
        required: false
        default: "0"
      dry_publish:
        description: "只跑不推送数据仓"
        required: false
        default: false
        type: boolean
      cache_buster:
        description: "缓存隔离标记：填新值 = 强制冷启动（Gate3 计时判据用）"
        required: false
        default: "0"
        type: string
      no_shard:
        description: "跳过所有分片，只让 merge 全量跑（第5道：分片版 vs 不分片版对照）"
        required: false
        default: false
        type: boolean

  # ⚠️ 生产定时任务：Gate 1–5 + 最终日志审计全部通过后再解注释
  # 每天五轮（北京时间）= UTC 时区；按 317 期真实发布节奏定的档位：
  #   12:00 → 04:00Z   15:00 → 07:00Z   18:00 → 10:00Z
  #   20:15 → 12:15Z   20:50 → 12:50Z（跑完约 21:08，赶在开奖前）
  # 去掉原来的 23:00：20:50 之后的数据不需要。
  # schedule:
  #   - cron: '0 4 * * *'      # 12:00 北京时间
  #   - cron: '0 7 * * *'      # 15:00
  #   - cron: '0 10 * * *'     # 18:00
  #   - cron: '15 12 * * *'    # 20:15
  #   - cron: '50 12 * * *'    # 20:50

concurrency:
  group: crawl-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"      # cloud/core/*.pyc 是 3.13 编译（magic f30d0d0a），必须一致
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONIOENCODING: "utf-8"
  # 每源分片数（唯一事实源）：plan 用它算「按累计图片数」的均衡分组，
  # shard job 的 matrix 用它取下标 —— 两处必须同源，否则分组与下标对不上。
  SHARD_MAP: "dahkg:12,aocai:5,tuku:3"

jobs:
  # ---------------- JobP：决定跑哪些源 + 每源分片数 ----------------
  plan:
    name: "JobP 计划"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sources: ${{ steps.pick.outputs.sources }}
      shards_dahkg: ${{ steps.pick.outputs.shards_dahkg }}
      count_dahkg: ${{ steps.pick.outputs.count_dahkg }}
      shards_aocai: ${{ steps.pick.outputs.shards_aocai }}
      count_aocai: ${{ steps.pick.outputs.count_aocai }}
      shards_tuku: ${{ steps.pick.outputs.shards_tuku }}
      count_tuku: ${{ steps.pick.outputs.count_tuku }}
    steps:
      - name: 计算源列表与分片数
        id: pick
        env:
          REQ: ${{ github.event.inputs.source || 'tuku' }}
        run: |
          echo "请求源: $REQ"
          case "$REQ" in
            all) echo 'sources=["tuku","aocai","dahkg"]' >> "$GITHUB_OUTPUT" ;;
            tuku|aocai|dahkg) echo "sources=[\"$REQ\"]" >> "$GITHUB_OUTPUT" ;;
            *) echo "未知源: $REQ" >&2; exit 2 ;;
          esac
          python -c "import json;n=12;print('shards_dahkg='+json.dumps(list(range(n))));print('count_dahkg='+str(n))" >> "$GITHUB_OUTPUT"
          python -c "import json;n=5;print('shards_aocai='+json.dumps(list(range(n))));print('count_aocai='+str(n))" >> "$GITHUB_OUTPUT"
          python -c "import json;n=3;print('shards_tuku='+json.dumps(list(range(n))));print('count_tuku='+str(n))" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # ---------------- Job 0：清理（图片 2 天轮转 + 产物 30 期轮转）----------------
  cleanup:
    name: "Job0 cleanup 轮转"
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: repo
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 检出私有数据仓
        uses: actions/checkout@v4
        with:
          repository: wangpha/liuhe-data
          token: ${{ secrets.LIUHE_DATA_TOKEN }}
          path: repo/work/store
      - name: 清理轮转（图片 2 天 / 产物 30 期）
        working-directory: repo
        run: |
          set -o pipefail
          python -m cloud.runner --cleanup --work work --store work/store --keep-days 2 --keep-periods 30 2>&1 | tee work/cleanup.log
      - name: 提交轮转结果
        working-directory: repo/work/store
        run: |
          git config user.name  "liuhe-bot"
          git config user.email "liuhe-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "无变化"; else
            git commit -m "cleanup: 图片2天/产物30期轮转 $(date -u +%Y-%m-%dT%H:%M:%SZ)"; git push; fi
      - name: 保存清理日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-log-${{ github.run_id }}
          path: repo/work/cleanup.log
          if-no-files-found: warn

  # ---------------- Job 1：逐源 plan（期号探测，三源口径不同）----------------
  prepare:
    name: "计划 ${{ matrix.source }}"
    needs: [plan, cleanup]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.sources) }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: repo
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 检出私有数据仓（读状态）
        uses: actions/checkout@v4
        with:
          repository: wangpha/liuhe-data
          token: ${{ secrets.LIUHE_DATA_TOKEN }}
          path: repo/work/store
      - name: 安装依赖
        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cloud/requirements.txt
      - name: 生成 plan（含期号探测证据）
        working-directory: repo
        run: |
          set -o pipefail
          python -m cloud.runner --plan --source "${{ matrix.source }}" \
            --work work --state work/store/state 2>&1 | tee "work/plan_${{ matrix.source }}.log"
      - name: 上传 plan
        uses: actions/upload-artifact@v4
        with:
          name: plans-${{ matrix.source }}-${{ github.run_id }}
          path: |
            repo/work/plan
            repo/work/plan_${{ matrix.source }}.log
          if-no-files-found: error

  # ---------------- 分片 dahkg：#=0..11 （并行预热缓存）----------------
  shard_dahkg:
    name: "分片 dahkg#${{ matrix.shard }}"
    needs: [plan, prepare]
    if: contains(needs.plan.outputs.sources, 'dahkg') && github.event.inputs.no_shard != 'true'
    runs-on: ubuntu-24.04
    # 硬超时保护：实测 runner CPU 异构（AMD EPYC 0.37s/图 vs Intel 6975P 1.95s/图，
    # 差 5.3 倍），慢机会把单片拖到 25 分钟以上。这里封顶 20 分钟；
    # runner 内部还有 16 分钟「软超时」：到点把剩余帖子写 unfinished_*.json 后正常退出，
    # 剩余工作交给 merge 补抓（见 runner.py 的 watchdog）。
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards_dahkg) }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: repo
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 安装系统依赖（opencv 需要 libGL）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: 恢复 pip 缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('repo/cloud/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - name: 安装依赖
        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cloud/requirements.txt
          python -c "import rapidocr_onnxruntime, onnxruntime, cv2, openpyxl, Crypto; print('deps ok', onnxruntime.__version__, cv2.__version__)"
      - name: 下载本源 plan
        uses: actions/download-artifact@v4
        with:
          name: plans-dahkg-${{ github.run_id }}
          path: repo/work/plan-dl
      - name: 归位 plan
        working-directory: repo
        run: |
          mkdir -p work/plan
          cp -v work/plan-dl/plan/*.json work/plan/ 2>/dev/null || true
          find work/plan-dl -name 'plan_*.json' -exec cp -v {} work/plan/ \;
          ls -la work/plan
      - name: 恢复 OCR 缓存
        uses: actions/cache@v4
        with:
          path: repo/work/out
          key: ocr-v3-dahkg-${{ github.event.inputs.cache_buster || '0' }}-${{ github.run_id }}-${{ matrix.shard }}
          restore-keys: |
            ocr-v3-dahkg-${{ github.event.inputs.cache_buster || '0' }}-
      - name: 分片预热（只处理本片：详情+回复+图片+OCR）
        id: shard
        working-directory: repo
        env:
          NO_OCR: ${{ github.event.inputs.no_ocr || 'false' }}
          NO_IMAGES: ${{ github.event.inputs.no_images || 'false' }}
        run: |
          set -o pipefail
          EXTRA=""
          [ "$NO_OCR" = "true" ] && EXTRA="$EXTRA --no-ocr"
          [ "$NO_IMAGES" = "true" ] && EXTRA="$EXTRA --no-images"
          python -m cloud.runner --shard "${{ matrix.shard }}" \
            --shards "${{ needs.plan.outputs.count_dahkg }}" \
            --source "dahkg" --work work --out work/out --workers 8 \
            $EXTRA 2>&1 | tee "work/shard_dahkg_${{ matrix.shard }}.log"
      - name: 精简缓存体积（删图片，只留 .cache）
        if: always()
        working-directory: repo
        run: |
          # actions/cache 的 path 是 repo/work/out，图片占 99%：
          # 实测单片缓存 ~900MB，12 片 10.8GB > GitHub 的 10GB 上限 → 互相驱逐、越跑越冷。
          # 真正值得缓存的是 .cache（详情/回复/OCR 结果，压缩后 ~0.3MB），
          # 图片每轮重新下载即可（并行、每片几百张，远小于缓存打爆的代价）。
          before=$(du -sm work/out 2>/dev/null | cut -f1 || echo 0)
          find work/out -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' \) -delete 2>/dev/null || true
          after=$(du -sm work/out 2>/dev/null | cut -f1 || echo 0)
          echo "分片缓存瘦身：${before}MB -> ${after}MB（图片不进缓存，.cache 保留）"
      - name: 打包本片缓存
        if: always()
        working-directory: repo
        run: |
          mkdir -p work/cacheout
          ( cd work/out && find . -type d -name .cache -print0 2>/dev/null \
            | tar -czf ../../work/cacheout/cache_dahkg_${{ matrix.shard }}.tar.gz --null -T - 2>/dev/null ) \
            || echo "没有 .cache 可打包（本片可能是空片）"
          ls -la work/cacheout
      - name: 上传本片缓存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-dahkg-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            repo/work/cacheout
            repo/work/shard_dahkg_${{ matrix.shard }}.log
            repo/work/unfinished
          if-no-files-found: warn

  # ---------------- 分片 aocai：#=0..4 （并行预热缓存）----------------
  shard_aocai:
    name: "分片 aocai#${{ matrix.shard }}"
    needs: [plan, prepare]
    if: contains(needs.plan.outputs.sources, 'aocai') && github.event.inputs.no_shard != 'true'
    runs-on: ubuntu-24.04
    # 硬超时保护：实测 runner CPU 异构（AMD EPYC 0.37s/图 vs Intel 6975P 1.95s/图，
    # 差 5.3 倍），慢机会把单片拖到 25 分钟以上。这里封顶 20 分钟；
    # runner 内部还有 16 分钟「软超时」：到点把剩余帖子写 unfinished_*.json 后正常退出，
    # 剩余工作交给 merge 补抓（见 runner.py 的 watchdog）。
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards_aocai) }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: repo
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 安装系统依赖（opencv 需要 libGL）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: 恢复 pip 缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('repo/cloud/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - name: 安装依赖
        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cloud/requirements.txt
          python -c "import rapidocr_onnxruntime, onnxruntime, cv2, openpyxl, Crypto; print('deps ok', onnxruntime.__version__, cv2.__version__)"
      - name: 下载本源 plan
        uses: actions/download-artifact@v4
        with:
          name: plans-aocai-${{ github.run_id }}
          path: repo/work/plan-dl
      - name: 归位 plan
        working-directory: repo
        run: |
          mkdir -p work/plan
          cp -v work/plan-dl/plan/*.json work/plan/ 2>/dev/null || true
          find work/plan-dl -name 'plan_*.json' -exec cp -v {} work/plan/ \;
          ls -la work/plan
      - name: 恢复 OCR 缓存
        uses: actions/cache@v4
        with:
          path: repo/work/out
          key: ocr-v3-aocai-${{ github.event.inputs.cache_buster || '0' }}-${{ github.run_id }}-${{ matrix.shard }}
          restore-keys: |
            ocr-v3-aocai-${{ github.event.inputs.cache_buster || '0' }}-
      - name: 分片预热（只处理本片：详情+回复+图片+OCR）
        id: shard
        working-directory: repo
        env:
          NO_OCR: ${{ github.event.inputs.no_ocr || 'false' }}
          NO_IMAGES: ${{ github.event.inputs.no_images || 'false' }}
        run: |
          set -o pipefail
          EXTRA=""
          [ "$NO_OCR" = "true" ] && EXTRA="$EXTRA --no-ocr"
          [ "$NO_IMAGES" = "true" ] && EXTRA="$EXTRA --no-images"
          python -m cloud.runner --shard "${{ matrix.shard }}" \
            --shards "${{ needs.plan.outputs.count_aocai }}" \
            --source "aocai" --work work --out work/out --workers 8 \
            $EXTRA 2>&1 | tee "work/shard_aocai_${{ matrix.shard }}.log"
      - name: 精简缓存体积（删图片，只留 .cache）
        if: always()
        working-directory: repo
        run: |
          # actions/cache 的 path 是 repo/work/out，图片占 99%：
          # 实测单片缓存 ~900MB，12 片 10.8GB > GitHub 的 10GB 上限 → 互相驱逐、越跑越冷。
          # 真正值得缓存的是 .cache（详情/回复/OCR 结果，压缩后 ~0.3MB），
          # 图片每轮重新下载即可（并行、每片几百张，远小于缓存打爆的代价）。
          before=$(du -sm work/out 2>/dev/null | cut -f1 || echo 0)
          find work/out -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' \) -delete 2>/dev/null || true
          after=$(du -sm work/out 2>/dev/null | cut -f1 || echo 0)
          echo "分片缓存瘦身：${before}MB -> ${after}MB（图片不进缓存，.cache 保留）"
      - name: 打包本片缓存
        if: always()
        working-directory: repo
        run: |
          mkdir -p work/cacheout
          ( cd work/out && find . -type d -name .cache -print0 2>/dev/null \
            | tar -czf ../../work/cacheout/cache_aocai_${{ matrix.shard }}.tar.gz --null -T - 2>/dev/null ) \
            || echo "没有 .cache 可打包（本片可能是空片）"
          ls -la work/cacheout
      - name: 上传本片缓存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-aocai-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            repo/work/cacheout
            repo/work/shard_aocai_${{ matrix.shard }}.log
            repo/work/unfinished
          if-no-files-found: warn

  # ---------------- 分片 tuku：#=0..2 （并行预热缓存）----------------
  shard_tuku:
    name: "分片 tuku#${{ matrix.shard }}"
    needs: [plan, prepare]
    if: contains(needs.plan.outputs.sources, 'tuku') && github.event.inputs.no_shard != 'true'
    runs-on: ubuntu-24.04
    # 硬超时保护：实测 runner CPU 异构（AMD EPYC 0.37s/图 vs Intel 6975P 1.95s/图，
    # 差 5.3 倍），慢机会把单片拖到 25 分钟以上。这里封顶 20 分钟；
    # runner 内部还有 16 分钟「软超时」：到点把剩余帖子写 unfinished_*.json 后正常退出，
    # 剩余工作交给 merge 补抓（见 runner.py 的 watchdog）。
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards_tuku) }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: repo
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 安装系统依赖（opencv 需要 libGL）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: 恢复 pip 缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('repo/cloud/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - name: 安装依赖
        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cloud/requirements.txt
          python -c "import rapidocr_onnxruntime, onnxruntime, cv2, openpyxl, Crypto; print('deps ok', onnxruntime.__version__, cv2.__version__)"
      - name: 下载本源 plan
        uses: actions/download-artifact@v4
        with:
          name: plans-tuku-${{ github.run_id }}
          path: repo/work/plan-dl
      - name: 归位 plan
        working-directory: repo
        run: |
          mkdir -p work/plan
          cp -v work/plan-dl/plan/*.json work/plan/ 2>/dev/null || true
          find work/plan-dl -name 'plan_*.json' -exec cp -v {} work/plan/ \;
          ls -la work/plan
      - name: 恢复 OCR 缓存
        uses: actions/cache@v4
        with:
          path: repo/work/out
          key: ocr-v3-tuku-${{ github.event.inputs.cache_buster || '0' }}-${{ github.run_id }}-${{ matrix.shard }}
          restore-keys: |
            ocr-v3-tuku-${{ github.event.inputs.cache_buster || '0' }}-
      - name: 分片预热（只处理本片：详情+回复+图片+OCR）
        id: shard
        working-directory: repo
        env:
          NO_OCR: ${{ github.event.inputs.no_ocr || 'false' }}
          NO_IMAGES: ${{ github.event.inputs.no_images || 'false' }}
        run: |
          set -o pipefail
          EXTRA=""
          [ "$NO_OCR" = "true" ] && EXTRA="$EXTRA --no-ocr"
          [ "$NO_IMAGES" = "true" ] && EXTRA="$EXTRA --no-images"
          python -m cloud.runner --shard "${{ matrix.shard }}" \
            --shards "${{ needs.plan.outputs.count_tuku }}" \
            --source "tuku" --work work --out work/out --workers 8 \
            $EXTRA 2>&1 | tee "work/shard_tuku_${{ matrix.shard }}.log"
      - name: 精简缓存体积（删图片，只留 .cache）
        if: always()
        working-directory: repo
        run: |
          # actions/cache 的 path 是 repo/work/out，图片占 99%：
          # 实测单片缓存 ~900MB，12 片 10.8GB > GitHub 的 10GB 上限 → 互相驱逐、越跑越冷。
          # 真正值得缓存的是 .cache（详情/回复/OCR 结果，压缩后 ~0.3MB），
          # 图片每轮重新下载即可（并行、每片几百张，远小于缓存打爆的代价）。
          before=$(du -sm work/out 2>/dev/null | cut -f1 || echo 0)
          find work/out -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' \) -delete 2>/dev/null || true
          after=$(du -sm work/out 2>/dev/null | cut -f1 || echo 0)
          echo "分片缓存瘦身：${before}MB -> ${after}MB（图片不进缓存，.cache 保留）"
      - name: 打包本片缓存
        if: always()
        working-directory: repo
        run: |
          mkdir -p work/cacheout
          ( cd work/out && find . -type d -name .cache -print0 2>/dev/null \
            | tar -czf ../../work/cacheout/cache_tuku_${{ matrix.shard }}.tar.gz --null -T - 2>/dev/null ) \
            || echo "没有 .cache 可打包（本片可能是空片）"
          ls -la work/cacheout
      - name: 上传本片缓存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-tuku-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            repo/work/cacheout
            repo/work/shard_tuku_${{ matrix.shard }}.log
            repo/work/unfinished
          if-no-files-found: warn

  # ---------------- 合并 dahkg：解开各片缓存后完整跑一次 ----------------
  merge_dahkg:
    name: "合并 dahkg"
    needs: [plan, prepare, shard_dahkg]
    # 必须带源过滤：只跑本次选中的源，否则 tuku-only 运行会把 dahkg/aocai 的 merge 也拉起来（白跑几小时）
    if: always() && !cancelled() && contains(needs.plan.outputs.sources, 'dahkg')
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: repo
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 检出私有数据仓（读状态：期号/快照）
        uses: actions/checkout@v4
        with:
          repository: wangpha/liuhe-data
          token: ${{ secrets.LIUHE_DATA_TOKEN }}
          path: repo/work/store
      - name: 安装系统依赖（opencv 需要 libGL）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: 恢复 pip 缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('repo/cloud/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - name: 安装依赖
        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cloud/requirements.txt
      - name: 下载本源 plan（含内容指纹 + 分片分配）
        uses: actions/download-artifact@v4
        with:
          name: plans-dahkg-${{ github.run_id }}
          path: repo/work/plan-dl
      - name: 归位 plan（merge 用 postHashes 做内容指纹快照与回复数对账）
        working-directory: repo
        run: |
          mkdir -p work/plan
          find work/plan-dl -name 'plan_*.json' -exec cp -v {} work/plan/ \;
          ls -la work/plan
      - name: 下载各分片缓存
        uses: actions/download-artifact@v4
        with:
          pattern: cache-dahkg-*-${{ github.run_id }}
          path: repo/work/incoming-cache
      - name: 解开各分片缓存到独立目录（不能直接解到 work/out，否则同名 JSON 互相覆盖）
        working-directory: repo
        run: |
          rm -rf work/cache-in && mkdir -p work/cache-in work/out
          n=0
          for f in $(find work/incoming-cache -name 'cache_*.tar.gz' -type f 2>/dev/null); do
            name=$(basename "$f" .tar.gz)
            mkdir -p "work/cache-in/$name"
            tar -xzf "$f" -C "work/cache-in/$name"
            n=$((n+1))
          done
          echo "共解开 $n 份分片缓存到 work/cache-in/"
          find work/cache-in -maxdepth 1 -mindepth 1 -type d | head -20
      - name: 恢复 OCR 缓存（actions/cache 兜底；必须在合并分片缓存**之前**，否则会用旧快照覆盖合并结果）
        uses: actions/cache@v4
        with:
          path: repo/work/out
          key: ocr-v3-dahkg-${{ github.event.inputs.cache_buster || '0' }}-${{ github.run_id }}-merge
          restore-keys: |
            ocr-v3-dahkg-${{ github.event.inputs.cache_buster || '0' }}-
      - name: 合并分片缓存（details/replies/threads/list 按 key 取并集，OCR 按文件名复制）
        working-directory: repo
        run: |
          set -o pipefail
          python cloud/merge_caches.py --target work/out --sources work/cache-in/* 2>&1 | tee work/merge_caches.log
      - name: 清理昨日图片（R2）
        working-directory: repo
        run: |
          set -o pipefail
          python -m cloud.runner --cleanup --work work --out work/out --keep-days 2 --skip-periods 2>&1 | tee work/images_cleanup.log
      - name: 完整跑一次（缓存全命中）+ 五道防线校验
        id: merge
        working-directory: repo
        env:
          LIUHE_CLOUD_WORK: work
          NO_OCR: ${{ github.event.inputs.no_ocr || 'false' }}
          NO_IMAGES: ${{ github.event.inputs.no_images || 'false' }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: |
          set -o pipefail
          EXTRA=""
          [ "$NO_OCR" = "true" ] && EXTRA="$EXTRA --no-ocr"
          [ "$NO_IMAGES" = "true" ] && EXTRA="$EXTRA --no-images"
          [ "$LIMIT" != "0" ] && EXTRA="$EXTRA --limit $LIMIT"
          python -m cloud.runner --merge --source "dahkg" --work work --out work/out \
            --state work/store/state --workers 4 $EXTRA 2>&1 | tee "work/run_dahkg.log"
      - name: 日志零错误审计（文档 6B.3 方式 1）
        if: always()
        working-directory: repo
        run: |
          LOG="work/run_dahkg.log"
          if [ -f "$LOG" ]; then
            python cloud/audit_logs.py "$LOG" --json "work/audit/logaudit_dahkg.json" || true
          fi
      - name: 汇总产物清单
        if: always()
        working-directory: repo
        run: |
          find work/out -maxdepth 3 -type d -name '*期' > work/_periods.txt 2>/dev/null || true
          while read -r d; do [ -n "$d" ] || continue; echo "$d : $(find "$d" -maxdepth 1 -type f | wc -l) 个文件"; done < work/_periods.txt
          du -sh work/out 2>/dev/null || true
      - name: 上传日志与审计证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-dahkg-${{ github.run_id }}
          path: |
            repo/work/run_dahkg.log
            repo/work/audit
            repo/work/state
            repo/work/plan
            repo/work/images_cleanup.log
          if-no-files-found: warn
      - name: 上传产物（数据类，不含图片）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: products-dahkg-${{ github.run_id }}
          path: |
            repo/work/out
            !repo/work/out/**/images/**
          if-no-files-found: warn

