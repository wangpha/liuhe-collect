name: 六合云端采集

# 门禁纪律（文档 6B.5）：Gate 1–5 全部 ✅ 之前，定时任务保持关闭。
# 下方 schedule 段默认被注释；只有全部门禁通过后才允许启用。

on:
  workflow_dispatch:
    inputs:
      source:
        description: "采集哪个源"
        required: true
        default: "tuku"
        type: choice
        options: [tuku, aocai, dahkg, all]
      no_ocr:
        description: "跳过 OCR（只抓数据，用于链路验证）"
        required: false
        default: false
        type: boolean
      no_images:
        description: "跳过图片下载"
        required: false
        default: false
        type: boolean
      limit:
        description: "仅抓前 N 条（0 = 全量）"
        required: false
        default: "0"
      shards:
        description: "分片数（1 = 单 job；冷缓存大港澳可用 10）"
        required: false
        default: "1"
      dry_publish:
        description: "只跑不推送数据仓"
        required: false
        default: false
        type: boolean

  # ⚠️ 生产定时任务：Gate 1–5 + 最终审计全部通过后再解注释
  # schedule:
  #   - cron: '30 8 * * *'    # 16:30 北京时间（提前 30 分钟，避开 GitHub cron 延迟）
  #   - cron: '30 10 * * *'   # 18:30
  #   - cron: '30 12 * * *'   # 20:30
  #   - cron: '0 15 * * *'    # 23:00（当天全量收齐）

concurrency:
  group: crawl-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  # ---------------- Job 0：清理（图片 2 天轮转 + 产物 30 期轮转）----------------
  cleanup:
    name: "Job0 cleanup 轮转"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      rotated: ${{ steps.rot.outputs.changed }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: repo

      - name: 检出私有数据仓（数据 + 状态 + 日志）
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: wangpha/liuhe-data
          token: ${{ secrets.LIUHE_DATA_TOKEN }}
          path: repo/work/store

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 清理轮转
        id: rot
        working-directory: repo
        run: |
          python -m cloud.runner --cleanup \
            --work work \
            --store work/store \
            --keep-days 2 \
            --keep-periods 30 2>&1 | tee cleanup.log

      - name: 提交轮转结果
        working-directory: repo/work/store
        run: |
          git config user.name  "liuhe-bot"
          git config user.email "liuhe-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "无变化，不提交"
          else
            git commit -m "cleanup: 图片2天/产物30期轮转 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 保存清理日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-log
          path: repo/cleanup.log
          if-no-files-found: warn

  # ---------------- Job 1：采集（每个源一个 job）----------------
  collect:
    name: "采集 ${{ matrix.source }}"
    needs: cleanup
    if: |
      always() && (needs.cleanup.result == 'success' || needs.cleanup.result == 'skipped' || needs.cleanup.result == 'failure') &&
      (inputs.source == 'all' || inputs.source == matrix.source)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        source: [tuku, aocai, dahkg]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: repo

      - name: 检出私有数据仓（读状态：期号/快照）
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: wangpha/liuhe-data
          token: ${{ secrets.LIUHE_DATA_TOKEN }}
          path: repo/work/store

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 恢复 pip 缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('repo/cloud/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: 安装依赖
        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cloud/requirements.txt

      - name: 恢复 OCR 缓存（跨机器命中率的关键）
        uses: actions/cache@v4
        with:
          path: repo/work/out
          key: ocr-v1-${{ matrix.source }}-${{ github.run_id }}
          restore-keys: |
            ocr-v1-${{ matrix.source }}-

      - name: 环境自检
        working-directory: repo
        run: |
          python -m cloud.runner --selftest --work work
          python - <<'PY'
          import cloud._compat as c
          print("env =", c.prepare())
          PY

      - name: 采集 + 五道防线校验
        id: crawl
        working-directory: repo
        env:
          LIUHE_CLOUD_WORK: work
        run: |
          set -o pipefail
          python -m cloud.runner --run \
            --source "${{ matrix.source }}" \
            --work work \
            --out work/out \
            --workers 4 \
            --limit 0 \
            ${{ inputs.no_ocr && '--no-ocr' || '' }} \
            ${{ inputs.no_images && '--no-images' || '' }} \
            ${{ inputs.limit != '0' && format('--limit {0}', inputs.limit) || '' }} \
            2>&1 | tee "work/run_${{ matrix.source }}.log"

      - name: 汇总产物清单
        if: always()
        working-directory: repo
        run: |
          echo "=== out 目录结构 ==="
          find work/out -maxdepth 3 -type d | head -50
          echo "=== 产物文件 ==="
          find work/out -maxdepth 4 -name '*.json' -o -maxdepth 4 -name '*.xlsx' -o -maxdepth 4 -name '*.html' | head -60
          du -sh work/out 2>/dev/null || true

      - name: 上传采集日志与审计
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ matrix.source }}-${{ github.run_id }}
          path: |
            repo/work/run_${{ matrix.source }}.log
            repo/work/audit
            repo/work/state
            repo/work/plan
          if-no-files-found: warn

      - name: 上传产物（数据类，不含图片）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: products-${{ matrix.source }}-${{ github.run_id }}
          path: |
            repo/work/out
            !repo/work/out/**/images/**
          if-no-files-found: warn

  # ---------------- Job 12：合并产物并推送到私有数据仓 ----------------
  publish:
    name: "Job12 publish 推数据仓"
    needs: collect
    if: |
      always() && !cancelled() && inputs.dry_publish != true &&
      contains(needs.collect.result, 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: repo

      - name: 检出私有数据仓
        uses: actions/checkout@v4
        with:
          repository: wangpha/liuhe-data
          token: ${{ secrets.LIUHE_DATA_TOKEN }}
          path: repo/work/store

      - name: 下载各源产物
        uses: actions/download-artifact@v4
        with:
          pattern: products-*-${{ github.run_id }}
          path: repo/work/incoming

      - name: 合并进数据仓 + 生成 manifest
        working-directory: repo
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          from datetime import datetime, timezone

          incoming = Path("work/incoming")
          store = Path("work/store")
          data = store / "data"
          data.mkdir(parents=True, exist_ok=True)

          copied = []
          for src_root in sorted(incoming.glob("products-*")):
              out = src_root / "work" / "out"
              if not out.is_dir():
                  continue
              for source_dir in out.iterdir():
                  if not source_dir.is_dir() or source_dir.name.startswith('.'):
                      continue
                  key = source_dir.name
                  for period_dir in source_dir.glob("*期"):
                      if not period_dir.is_dir():
                          continue
                      dst = data / key / period_dir.name
                      if dst.exists():
                          shutil.rmtree(dst)
                      shutil.copytree(period_dir, dst, ignore=shutil.ignore_patterns("images"))
                      copied.append(f"{key}/{period_dir.name}")

          manifest = {}
          for key_dir in sorted(p for p in data.iterdir() if p.is_dir()):
              periods = sorted((p for p in key_dir.iterdir() if p.is_dir()),
                               key=lambda p: int(''.join(c for c in p.name.split('_')[-1] if c.isdigit()) or 0))
              manifest[key_dir.name] = {
                  "periods": [p.name for p in periods],
                  "count": len(periods),
                  "files": {p.name: sum(1 for f in p.rglob('*') if f.is_file()) for p in periods},
              }
          (store / "manifest.json").write_text(
              json.dumps({"generatedAt": datetime.now(timezone.utc).isoformat(), "sources": manifest},
                         ensure_ascii=False, indent=2), encoding="utf-8")
          print("copied:", copied)
          print("manifest sources:", {k: v["count"] for k, v in manifest.items()})
          PY

      - name: 保存日志到数据仓
        working-directory: repo
        run: |
          mkdir -p work/store/logs
          for f in work/incoming/products-*/work/run_*.log; do
            [ -f "$f" ] || continue
            ts=$(date -u +%Y%m%d_%H%M%S)
            base=$(basename "$f" .log)
            cp "$f" "work/store/logs/${base}_${ts}_run${GITHUB_RUN_NUMBER}.log"
          done
          ls -la work/store/logs | tail -20
          # 只保留最近 30 份（文档 6B.4）
          ls -1t work/store/logs/*.log 2>/dev/null | tail -n +31 | xargs -r rm -f

      - name: 提交并推送
        working-directory: repo/work/store
        run: |
          git config user.name  "liuhe-bot"
          git config user.email "liuhe-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化"
            exit 0
          fi
          git commit -m "data: 云端采集 $(date -u +%Y-%m-%dT%H:%M:%SZ) run#${{ github.run_number }}"
          git push

      - name: 上传合并日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-log-${{ github.run_id }}
          path: repo/work/store/manifest.json
          if-no-files-found: warn
