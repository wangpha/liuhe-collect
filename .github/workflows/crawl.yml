            [ -f "$f" ] && echo "产物包 $(basename "$f"): $(du -m "$f" | cut -f1) MB / $(tar -tzf "$f" | wc -l) 个文件"
          done
      - name: 上传本片缓存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-aocai-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            repo/work/cacheout
            repo/work/shards
            repo/work/shard_aocai_${{ matrix.shard }}.log
            repo/work/unfinished
          if-no-files-found: warn

