        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cloud/requirements.txt
          python -c "import rapidocr_onnxruntime, onnxruntime, cv2, openpyxl, Crypto; print('deps ok', onnxruntime.__version__, cv2.__version__)"
      - name: 下载本源 plan
