          n=0
          for f in $(find work/incoming-cache -name 'cache_*.tar.gz' -type f 2>/dev/null); do
            name=$(basename "$f" .tar.gz)
            mkdir -p "work/cache-in/$name"
            tar -xzf "$f" -C "work/cache-in/$name"
            n=$((n+1))
          done
