name: 六合云端采集

# 门禁纪律（文档 6B.5）：Gate 1–5 全部 ✅ 之前，schedule 段保持注释，只允许手动触发。

on:
  workflow_dispatch:
    inputs:
      source:
        description: "采集哪个源"
        required: true
        default: "tuku"
        type: choice
        options: [tuku, aocai, dahkg, all]
      no_ocr:
        description: "跳过 OCR（只抓数据，验证链路用）"
        required: false
        default: false
        type: boolean
      no_images:
        description: "跳过图片下载"
        required: false
        default: false
        type: boolean
      limit:
        description: "仅抓前 N 条（0 = 全量）"
        required: false
        default: "0"
      dry_publish:
        description: "只跑不推送数据仓"
        required: false
        default: false
        type: boolean

  # ⚠️ 生产定时任务：Gate 1–5 + 最终日志审计全部通过后再解注释
  # schedule:
  #   - cron: '30 8 * * *'    # 16:30 北京时间
  #   - cron: '30 10 * * *'   # 18:30
  #   - cron: '30 12 * * *'   # 20:30
  #   - cron: '0 15 * * *'    # 23:00 收齐当天

concurrency:
  group: crawl-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  # ---------------- Job P：决定要跑哪些源（动态 matrix）----------------
  plan:
    name: "JobP 计划"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sources: ${{ steps.pick.outputs.sources }}
    steps:
      - name: 计算源列表
        id: pick
        env:
          REQ: ${{ github.event.inputs.source || 'tuku' }}
        run: |
          echo "请求源: $REQ"
          case "$REQ" in
            all) echo 'sources=["tuku","aocai","dahkg"]' >> "$GITHUB_OUTPUT" ;;
            tuku|aocai|dahkg) echo "sources=[\"$REQ\"]" >> "$GITHUB_OUTPUT" ;;
            *) echo "未知源: $REQ" >&2; exit 2 ;;
          esac
          cat "$GITHUB_OUTPUT"

  # ---------------- Job 0：清理（图片 2 天轮转 + 产物 30 期轮转）----------------
  cleanup:
    name: "Job0 cleanup 轮转"
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: repo

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 检出私有数据仓
        uses: actions/checkout@v4
        with:
          repository: wangpha/liuhe-data
          token: ${{ secrets.LIUHE_DATA_TOKEN }}
          path: repo/work/store

      - name: 清理轮转（图片 2 天 / 产物 30 期）
        working-directory: repo
        run: |
          set -o pipefail
          python -m cloud.runner --cleanup \
            --work work \
            --store work/store \
            --keep-days 2 \
            --keep-periods 30 2>&1 | tee work/cleanup.log

      - name: 提交轮转结果
        id: commit
        working-directory: repo/work/store
        run: |
          git config user.name  "liuhe-bot"
          git config user.email "liuhe-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "无变化，不提交"
          else
            git commit -m "cleanup: 图片2天/产物30期轮转 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 保存清理日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-log-${{ github.run_id }}
          path: repo/work/cleanup.log
          if-no-files-found: warn

  # ---------------- Job 1：采集（动态 matrix，每个源一个 job）----------------
  collect:
    name: "采集 ${{ matrix.source }}"
    needs: [plan, cleanup]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.sources) }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: repo

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 检出私有数据仓（读状态：期号/快照）
        uses: actions/checkout@v4
        with:
          repository: wangpha/liuhe-data
          token: ${{ secrets.LIUHE_DATA_TOKEN }}
          path: repo/work/store

      - name: 恢复 pip 缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('repo/cloud/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: 安装依赖
        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cloud/requirements.txt
          python -c "import rapidocr_onnxruntime, onnxruntime, cv2, openpyxl, Crypto; print('deps ok')"

      - name: 恢复 OCR 缓存（跨运行命中率的关键）
        uses: actions/cache@v4
        with:
          path: repo/work/out
          key: ocr-v1-${{ matrix.source }}-${{ github.run_id }}
          restore-keys: |
            ocr-v1-${{ matrix.source }}-

      - name: 环境自检 + 单元自检
        working-directory: repo
        run: |
          python -m cloud.runner --selftest --work work

      - name: 采集 + 五道防线校验
        id: crawl
        working-directory: repo
        env:
          LIUHE_CLOUD_WORK: work
          NO_OCR: ${{ github.event.inputs.no_ocr || 'false' }}
          NO_IMAGES: ${{ github.event.inputs.no_images || 'false' }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: |
          set -o pipefail
          EXTRA=""
          [ "$NO_OCR" = "true" ] && EXTRA="$EXTRA --no-ocr"
          [ "$NO_IMAGES" = "true" ] && EXTRA="$EXTRA --no-images"
          [ "$LIMIT" != "0" ] && EXTRA="$EXTRA --limit $LIMIT"
          echo "附加参数: $EXTRA"
          python -m cloud.runner --run \
            --source "${{ matrix.source }}" \
            --work work \
            --out work/out \
            --workers 4 \
            $EXTRA 2>&1 | tee "work/run_${{ matrix.source }}.log"

      - name: 日志零错误审计（文档 6B.3 方式 1）
        if: always()
        working-directory: repo
        run: |
          LOG="work/run_${{ matrix.source }}.log"
          if [ -f "$LOG" ]; then
            python cloud/audit_logs.py "$LOG" --json "work/audit/logaudit_${{ matrix.source }}.json" || true
          else
            echo "没有日志文件"
          fi

      - name: 汇总产物清单
        if: always()
        working-directory: repo
        run: |
          echo "=== 产物目录 ==="
          find work/out -maxdepth 3 -type d | head -40
          echo "=== 每期文件数与大小 ==="
          for d in $(find work/out -maxdepth 3 -type d -name '*期'); do
            echo "$d : $(find "$d" -maxdepth 1 -type f | wc -l) 个文件"
          done
          du -sh work/out 2>/dev/null || true

      - name: 上传日志与审计证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ matrix.source }}-${{ github.run_id }}
          path: |
            repo/work/run_${{ matrix.source }}.log
            repo/work/audit
            repo/work/state
            repo/work/plan
            repo/work/cleanup.log
          if-no-files-found: warn

      - name: 上传产物（数据类，不含图片）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: products-${{ matrix.source }}-${{ github.run_id }}
          path: |
            repo/work/out
            !repo/work/out/**/images/**
          if-no-files-found: warn

  # ---------------- Job 12：合并产物并推送到私有数据仓 ----------------
  publish:
    name: "Job12 publish 推数据仓"
    needs: collect
    if: always() && !cancelled() && needs.collect.result == 'success' && github.event.inputs.dry_publish != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: repo

      - name: 检出私有数据仓
        uses: actions/checkout@v4
        with:
          repository: wangpha/liuhe-data
          token: ${{ secrets.LIUHE_DATA_TOKEN }}
          path: repo/work/store

      - name: 下载各源产物
        uses: actions/download-artifact@v4
        with:
          pattern: products-*-${{ github.run_id }}
          path: repo/work/incoming

      - name: 合并进数据仓 + 生成 manifest
        working-directory: repo
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          from datetime import datetime, timezone

          incoming = Path("work/incoming")
          store = Path("work/store")
          data = store / "data"
          data.mkdir(parents=True, exist_ok=True)

          copied = []
          for src_root in sorted(incoming.glob("products-*")):
              out = src_root / "work" / "out"
              if not out.is_dir():
                  continue
              for source_dir in out.iterdir():
                  if not source_dir.is_dir() or source_dir.name.startswith('.'):
                      continue
                  if not list(source_dir.glob("*期")):
                      # 图库/澳彩期目录直接在 out 根下
                      pass
                  for period_dir in source_dir.glob("*期"):
                      dst = data / source_dir.name / period_dir.name
                      if dst.exists():
                          shutil.rmtree(dst)
                      shutil.copytree(period_dir, dst, ignore=shutil.ignore_patterns("images", ".cache"))
                      copied.append(f"{source_dir.name}/{period_dir.name}")
              # 图库：期目录直接位于 out 根
              for period_dir in out.glob("*期"):
                  dst = data / "tuku" / period_dir.name
                  if dst.exists():
                      shutil.rmtree(dst)
                  shutil.copytree(period_dir, dst, ignore=shutil.ignore_patterns("images", ".cache"))
                  copied.append(f"tuku/{period_dir.name}")

          manifest = {}
          for key_dir in sorted(p for p in data.iterdir() if p.is_dir()):
              periods = sorted((p for p in key_dir.iterdir() if p.is_dir()),
                               key=lambda p: int(''.join(c for c in p.name.split('_')[-1] if c.isdigit()) or 0))
              manifest[key_dir.name] = {
                  "periods": [p.name for p in periods],
                  "count": len(periods),
                  "files": {p.name: sum(1 for f in p.rglob('*') if f.is_file()) for p in periods},
              }
          (store / "manifest.json").write_text(
              json.dumps({"generatedAt": datetime.now(timezone.utc).isoformat(), "sources": manifest},
                         ensure_ascii=False, indent=2), encoding="utf-8")
          print("copied:", copied)
          print("manifest:", {k: v["count"] for k, v in manifest.items()})
          PY

      - name: 保存日志到数据仓（保留最近 30 份）
        working-directory: repo
        run: |
          mkdir -p work/store/logs
          for f in $(find work/incoming -name 'run_*.log'); do
            ts=$(date -u +%Y%m%d_%H%M%S)
            base=$(basename "$f" .log)
            cp "$f" "work/store/logs/${base}_${ts}_run${GITHUB_RUN_NUMBER}.log"
          done
          ls -la work/store/logs | tail -10
          ls -1t work/store/logs/*.log 2>/dev/null | tail -n +31 | xargs -r rm -f
          ls -1 work/store/logs/*.log 2>/dev/null | wc -l

      - name: 提交并推送
        working-directory: repo/work/store
        run: |
          git config user.name  "liuhe-bot"
          git config user.email "liuhe-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "data: 云端采集 $(date -u +%Y-%m-%dT%H:%M:%SZ) run#${{ github.run_number }}"
          git push

      - name: 上传合并结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ github.run_id }}
          path: repo/work/store/manifest.json
          if-no-files-found: warn
