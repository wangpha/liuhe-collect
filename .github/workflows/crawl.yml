          python -m cloud.runner --merge --source "tuku" --work work --out work/out \
            --state work/store/state --workers 8 $EXTRA --period "${{ github.event.inputs.period || '0' }}" --merge-mode "${{ github.event.inputs.merge_mode || 'summary' }}" 2>&1 | tee "work/run_tuku.log"
      - name: 失败/超时诊断（写 Step Summary）
        if: failure()
        run: |
          echo "## ⏱ 失败/超时诊断" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -30 work/run_tuku.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '\[详情\]|\[OCR\]|\[图片\]|\[plan\]|\[merge\]' work/run_tuku.log 2>/dev/null | tail -5 >> "$GITHUB_STEP_SUMMARY" || true
      - name: 日志零错误审计（文档 6B.3 方式 1）
        if: always()
        working-directory: repo
        run: |
          LOG="work/run_tuku.log"
          if [ -f "$LOG" ]; then
            python cloud/audit_logs.py "$LOG" --json "work/audit/logaudit_tuku.json" || true
          fi
      - name: 汇总产物清单
        if: always()
        working-directory: repo
        run: |
          find work/out -maxdepth 3 -type d -name '*期' > work/_periods.txt 2>/dev/null || true
          while read -r d; do [ -n "$d" ] || continue; echo "$d : $(find "$d" -maxdepth 1 -type f | wc -l) 个文件"; done < work/_periods.txt
          du -sh work/out 2>/dev/null || true
      - name: 上传日志与审计证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-tuku-${{ github.run_id }}
          path: |
            repo/work/run_tuku.log
            repo/work/audit
            repo/work/state
            repo/work/plan
            repo/work/images_cleanup.log
          if-no-files-found: warn
      # ⚠ 2026-11-21 新增（用户核心要求）：merge 汇总后把缓存存回 actions/cache。
      #   否则合并结果随 runner 销毁而丢失 → 下轮分片 restore 到的还是旧快照。
      #   ⚠ 但**不能**直接缓存 `work/out/**/.cache`：
      #     实测 run 44858821213 匹配到 22 个期目录、20+ 万文件，
      #     压缩上传 15+ 分钟 → merge 被 Watchdog 取消。
      #   改为：先把**当期**的 .cache 汇总到独立目录 work/pool，
      #     只缓存这个目录（当期约 10-40 MB，秒级完成）。
      # ⚠ 2026-11-21：merge **不保存 cache**。
      #   上一版在这里 save 全局池 → 要压缩上传 20+ 万 OCR 文件，
      #   实测耗时 16.8 分被 Watchdog 取消（与已删除的 ocr-merge-v3 同一坑）。
      #   缓存改由各分片自己 save（key 带片号，无冲突）。
      - name: 上传产物（数据类，不含图片）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: products-tuku-${{ github.run_id }}
          path: |
            repo/work/out
            !repo/work/out/**/images/**
          if-no-files-found: warn

  # ---------------- 整轮 watchdog：步骤级软超时（主）+ 40 分钟兜底（副） ----------------
  watchdog:
    name: "Watchdog 整轮 50 分钟上限"
    needs: [gate, plan]
    if: needs.gate.outputs.should_run == '1' && always()
    # 取消整轮需要 actions: write；默认 GITHUB_TOKEN 没有该权限（实测 403）
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: 整轮监控（步骤级软超时 + 40 分钟兜底）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_MIN: "50"
        run: |
          START=$(date +%s)
          TMP=$(mktemp)
          REPO="${{ github.repository }}"
          RUN="${{ github.run_id }}"

          # 步骤软超时（分钟）
          # ⚠ 规则：必须 **大于所属 job 的 timeout-minutes**，否则 watchdog 会抢在
          #   GitHub 的 job timeout 之前 cancel 整个 run（2026-11-18 run 44335605899 事故：
          #   分片预热软超时 21 < job timeout 25 → tuku#1 跑到 22.4 分被 watchdog cancel，
          #   连累 merge 从未启动）。job timeout 只 kill 单个 job（有 continue-on-error 保护）。
          soft_limit() {
            case "$1" in
              "Set up job") echo 3 ;;
              "检出代码") echo 3 ;;
              "安装 Python") echo 3 ;;
              "检出私有数据仓"*) echo 3 ;;
              "安装系统依赖"*) echo 5 ;;
              "恢复 pip 缓存") echo 3 ;;
              "安装依赖") echo 5 ;;
              "下载本源 plan"*) echo 3 ;;
              "归位 plan"*) echo 2 ;;
              "下载各分片缓存") echo 5 ;;
              "解开各分片缓存到独立目录"*) echo 5 ;;
              "恢复元数据缓存"*) echo 10 ;;
              "恢复 OCR 缓存"*) echo 10 ;;
              "把两层缓存铺回"*) echo 5 ;;
              "合并分片缓存"*) echo 10 ;;
              "清理昨日图片"*) echo 5 ;;
              "收集两层缓存"*) echo 5 ;;
              "缓存体积检查"*) echo 5 ;;
              "打包本片缓存") echo 8 ;;
              "上传本片缓存") echo 8 ;;
              "生成 plan"*) echo 16 ;;
              "分片预热"*) echo 26 ;;
              "完整跑一次"*) echo 26 ;;
              "上传产物"*) echo 8 ;;
              "上传日志与审计证据") echo 5 ;;
              "上传 plan") echo 5 ;;
              "失败/超时诊断"*) echo 5 ;;
              "读取本片期号"*) echo 3 ;;
              "整轮监控"*) echo 55 ;;
              *) echo 15 ;;
            esac
          }

          while true; do
            ELAPSED=$(( ($(date +%s) - START) / 60 ))

            # ① 业务是否全部完成（gh 内嵌 jq，不依赖外部 jq 二进制）
              #    ⚠ 2026-11-19：PENDING **排除 publish** —— publish 是最后一步，一旦开始就让它跑完。
              #    原因：run 44451294477 实测「分片 20/20 全 success、merge aocai/tuku success、
              #    merge dahkg 跑到 14.3 分」时 watchdog 在 40.4 分 cancel → publish 被 skip → 数据没入库。
              #    watchdog 的意图是防「卡死」不是防「慢」；数据安全 > 效率。
            PENDING=$(gh api "repos/$REPO/actions/runs/$RUN/jobs" \
              --jq '[.jobs[] | select(.name != "Watchdog 整轮 50 分钟上限") | select(.name | test("publish") | not) | select(.status != "completed")] | length' \
              2>/dev/null || echo 99)
            echo "=== 已跑 ${ELAPSED} 分（兜底 ${MAX_MIN}）；未完成 job 数 ${PENDING} ==="
            if [ "$PENDING" = "0" ]; then
              echo "✅ 所有业务 job 已完成（${ELAPSED} 分钟），watchdog 正常退出（不取消）"
              exit 0
            fi

            # ② 步骤级软超时
            OVER=""
            gh api "repos/$REPO/actions/runs/$RUN/jobs" \
              --jq '.jobs[] | select(.name != "Watchdog 整轮 50 分钟上限") | select(.status=="in_progress") | .name as $j | (.steps // [])[] | select(.status=="in_progress") | "\($j)\t\(.name)\t\(.started_at)"' \
              2>/dev/null > "$TMP.steps" || true
            while IFS="$(printf '\t')" read -r JN SN ST; do
              [ -n "${ST:-}" ] || continue
              S=$(date -d "$ST" +%s 2>/dev/null) || continue
              M=$(( ($(date +%s) - S) / 60 ))
              LIM=$(soft_limit "$SN")
              echo "    ${JN} / ${SN} : 已 ${M} 分（软超时 ${LIM}）"
              if [ "$M" -ge "$LIM" ]; then
                OVER="${JN} / ${SN} 已 ${M} 分 > 软超时 ${LIM} 分"
                break
              fi
            done < "$TMP.steps"

            if [ -n "$OVER" ]; then
              echo "::error::步骤超软超时：$OVER"
              {
                echo "## 🚨 步骤软超时诊断"
                echo ""
                echo "| 项 | 值 |"
                echo "|---|---|"
                echo "| 超时步骤 | $OVER |"
                echo "| 已跑整轮 | ${ELAPSED} 分钟 |"
                echo ""
                echo "| job | 当前步骤 | 状态 |"
                echo "|---|---|---|"
                gh api "repos/$REPO/actions/runs/$RUN/jobs" \
                  --jq '.jobs[] | select(.name != "Watchdog 整轮 50 分钟上限") | select(.status=="in_progress") | .name as $j | (.steps // [])[] | select(.status=="in_progress") | "| \($j) | \(.name) | \(.status) |"' \
                  2>/dev/null || true
              } >> "$GITHUB_STEP_SUMMARY"
              gh run cancel "$RUN" --repo "$REPO" || true
              exit 1
            fi

            # ③ 绝对兜底
            if [ "$ELAPSED" -ge "$MAX_MIN" ]; then
              echo "::error::整轮 ${ELAPSED} 分达绝对兜底 ${MAX_MIN} 分（仍有 ${PENDING} 个 job 未完成）"
              {
                echo "## 🚨 整轮兜底超时诊断（${MAX_MIN} 分钟）"
                echo ""
                echo "| job | 状态 | 开始时间 |"
                echo "|---|---|---|"
                gh api "repos/$REPO/actions/runs/$RUN/jobs" \
                  --jq '.jobs[] | "| \(.name) | \(.status) | \(.started_at) |"' \
                  2>/dev/null || true
              } >> "$GITHUB_STEP_SUMMARY"
              gh run cancel "$RUN" --repo "$REPO" || true
              exit 1
            fi

            sleep 60
          done


  # ---------------- Job 13：推送到私有数据仓 ----------------
  publish:
    name: "Job13 publish 推数据仓"
    # ⚠ 2026-11-22 根因修复（run 44974512476 / 45009070383 实测）：
    #   原来 needs 里**没有 gate**，却引用 needs.gate.outputs.should_run ——
    #   GitHub 无法解析未在 needs 中声明的 job 输出，条件失效 →
    #   gate 判定「跳过」时 publish 仍然执行 →
    #   FATAL: 没有把任何一期的产物写进数据仓 → 整轮 failure。
    #   修法：needs 加入 gate；条件不用 always() 包裹 should_run；
    #        并显式拒绝上游 skipped（gate 跳过时 merge 全 skipped）。
    needs: [gate, merge_dahkg, merge_aocai, merge_tuku]
    if: needs.gate.outputs.should_run == '1' && !cancelled() && github.event.inputs.dry_publish != 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: repo
      - name: 检出私有数据仓
        uses: actions/checkout@v4
        with:
          repository: wangpha/liuhe-data
          token: ${{ secrets.LIUHE_DATA_TOKEN }}
          path: repo/work/store
      - name: 下载各源产物
        uses: actions/download-artifact@v4
        with:
          pattern: products-*-${{ github.run_id }}
          path: repo/work/incoming
      - name: 下载各源运行日志与审计
        uses: actions/download-artifact@v4
        with:
          pattern: run-*-${{ github.run_id }}
          path: repo/work/incoming-logs
      - name: 写入数据仓（每期一个 tar.gz）+ 生成 manifest
        working-directory: repo
        run: |
          set -o pipefail
          python cloud/publish_store.py --incoming work/incoming --store work/store 2>&1 | tee work/publish_store.log

      - name: 保存日志到数据仓（保留最近 30 份）
        working-directory: repo
        run: |
          mkdir -p work/store/logs
          FOUND=0
          for f in $(find work/incoming work/incoming-logs -name 'run_*.log' -type f 2>/dev/null); do
            ts=$(date -u +%Y%m%d_%H%M%S); base=$(basename "$f" .log)
            cp "$f" "work/store/logs/${base}_${ts}_run${GITHUB_RUN_NUMBER}.log"; FOUND=$((FOUND+1))
          done
          for j in $(find work/incoming-logs -name 'audit_*.json' -o -name 'logaudit_*.json' 2>/dev/null | head -40); do
            cp "$j" "work/store/logs/" 2>/dev/null || true
          done
          echo "拷入日志 $FOUND 份"
          # ⚠ 2026-11-23 修复（审计 C-1，实测数据仓 logs/ 积了 127 个 audit_*.json）：
          #   原来 glob 只有 *.log，audit_*.json 永不轮转（README 承诺 30 份）。
          #   run_*.log 稳定 30 份证明机制有效，只是漏了 json 这一类。
          ls -1t work/store/logs/*.log 2>/dev/null | tail -n +31 | xargs -r rm -f
          ls -1t work/store/logs/audit_*.json 2>/dev/null | tail -n +31 | xargs -r rm -f
          echo "logs 轮转后：$(ls -1 work/store/logs/*.log 2>/dev/null | wc -l) 个 .log / $(ls -1 work/store/logs/audit_*.json 2>/dev/null | wc -l) 个 audit_*.json"
      - name: 提交并推送
        working-directory: repo/work/store
        run: |
          git config user.name  "liuhe-bot"
          git config user.email "liuhe-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "无变化"; exit 0; fi
          # ⚠ 2026-11-21：commit message 里带上期号，供本地软件反查
          #   （artifact 名只有 run_id，本地要显示「第X期」只能靠这里）
          # ⚠ 2026-11-21：期号提取第四次修正，**根治**。
          #   前三次都失败了：
          #     v1 grep -oP 的 K 标记 → runner 上取到空
          #     v2 sed 反向引用 → 被 Python 源码转义吃掉
          #     v3 grep '中文' → runner locale 匹配不到
          #     v4 data/*.tar.gz 前缀 → 但 run#131 实测 git diff 里**没有 .tar.gz**
          #        （同期内容未变，git 认为无变化，只有 logs 变了）
          #   真正可靠的数据源：`work/store/manifest.json` 里的 periods 字段
          #   （publish_store.py 每次都会写，与本次实际产出的期号完全一致）
          #   注：不用 heredoc（YAML 会破坏 run:| 缩进）；不依赖 python（路径不确定）；
          #   也不用 tr 换行技巧，因为 Python 源码里的转义会变成真换行 —— 只用 grep -o + sort -u
          #   ⚠ working-directory 就是 repo/work/store，所以路径是 ./manifest.json
          #     （run#132 实测：写成 work/store/manifest.json 会找不到文件 → 期?）
          PERIODS=""
          MAN="./manifest.json"
          if [ -f "$MAN" ]; then
            for tok in $(grep -o '澳门_[0-9]*_[0-9]*期' "$MAN" | sort -u); do
              p=${tok##*_}
              p=${p%期}
              case "$p" in
                ''|*[!0-9]*) continue ;;
              esac
              case ",$PERIODS," in
                *",$p,"*) ;;
                *) PERIODS="${PERIODS:+$PERIODS,}$p" ;;
              esac
            done
          fi
          [ -z "$PERIODS" ] && PERIODS="?"
          git commit -m "data: 云端采集(分片) 期${PERIODS} $(date -u +%Y-%m-%dT%H:%M:%SZ) run#${{ github.run_number }}"
          # ⚠ 2026-11-23 主动排查修复：并发两个 run 同时 publish 时，
          #   后者 push 会 non-fast-forward 失败。加 pull --rebase + 有限重试兜底。
          _pushed=0
          for _try in 1 2 3; do
            if git push; then _pushed=1; break; fi
            echo "push 第 ${_try} 次失败，pull --rebase 后重试…"
            git pull --rebase --autostash origin HEAD 2>/dev/null || true
            sleep 3
          done
          if [ "$_pushed" != "1" ]; then
            echo "::error::git push 连续 3 次失败（数据未推送到数据仓）"
            exit 1
          fi
      - name: 上传合并结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ github.run_id }}
          path: repo/work/store/manifest.json
          if-no-files-found: warn
