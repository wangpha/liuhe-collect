          # ⚠ 2026-11-19 实测教训：原写 1440s(24 分)，但 timeout 是**相对本 step 开始**算的，
          #   而前置步骤（检出/装依赖/恢复缓存）占 ~1 分钟 → 1+24 ≈ 25 = job timeout，两者竞争，
          #   有时 job timeout 先 SIGKILL → handler 没机会跑（日志里连「收到 SIGTERM」都没有）。
