        uses: actions/download-artifact@v4
        with:
          name: plans-dahkg-${{ github.run_id }}
          path: repo/work/plan-dl
      - name: 归位 plan（merge 用 postHashes 做内容指纹快照与回复数对账）
        working-directory: repo
        run: |
          mkdir -p work/plan
          find work/plan-dl -name 'plan_*.json' -exec cp -v {} work/plan/ \;
          ls -la work/plan
      - name: 下载各分片缓存
        uses: actions/download-artifact@v4
        with:
          pattern: cache-dahkg-*-${{ github.run_id }}
