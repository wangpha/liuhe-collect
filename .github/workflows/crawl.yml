      - name: 读取本片期号（供缓存分层用）
        id: period
        working-directory: repo
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json
          fs = glob.glob("work/plan/plan_*.json")
          p = 0
          if fs:
