name: 六合云端采集

# 门禁纪律（文档 6B.5）：Gate 1–5 全部 ✅ 之前，schedule 段保持注释，只允许手动触发。
#
# 分片架构（v3，2026-11-16）：
#   plan → cleanup → prepare(每源 --plan) → shard_{dahkg,aocai,tuku} ×N（并行预热缓存）
#        → merge_{dahkg,aocai,tuku}（每源一次完整跑）→ publish
#
# 为什么 shard / merge 都拆成三个独立 job：
#   GitHub Actions 的 `needs` 是 job 级。若 shard 是一个含三源的 matrix job，
#   任何 merge 都必须等整个 shard 结束（含最慢的源），跨源会互相拖。
#   拆开后 aocai/tuku 的 merge 可在 dahkg 还在分片时就完成。
#
# 为什么分片只在「列表取数函数」上打补丁：
#   三源采集流程差异极大（tuku 有 details/replies/ocr 三段缓存；aocai 走
#   collect_forum_posts；dahkg 自带 collect_posts）。若逐个复刻流程，
#   任何一处顺序/参数不同都会让 merge 产物与串行版不一致 —— 而一致性正是分片要证明的。
#   现在只切列表结果，下游全部是该模块自己的代码，语义天然一致。

on:
  workflow_dispatch:
    inputs:
      source:
        description: "采集哪个源"
        required: true
        default: "tuku"
        type: choice
        options: [tuku, aocai, dahkg, all]
      no_ocr:
        description: "跳过 OCR（只抓数据，验链路用）"
        required: false
        default: false
        type: boolean
      no_images:
        description: "跳过图片下载"
        required: false
        default: false
        type: boolean
      limit:
        description: "仅抓前 N 条（0 = 全量）"
        required: false
        default: "0"
      dry_publish:
        description: "只跑不推送数据仓"
        required: false
        default: false
        type: boolean
      cache_buster:
        description: "缓存隔离标记：填新值 = 强制冷启动（Gate3 计时判据用）"
        required: false
        default: "0"
        type: string
      no_shard:
        description: "跳过所有分片，只让 merge 全量跑（第5道：分片版 vs 不分片版对照）"
        required: false
        default: false
        type: boolean
      period:
        description: "指定期号（0=自动探测）。用于补跑/压测历史期；指定时不写回 lastPeriod、不做单调性检查"
        required: false
        default: "0"
        type: string
      slot:
        description: "档位（12:00/15:00/18:00/20:10/20:40）。20:40 会锁定台账期号不换期；空=不锁"
        required: false
        default: ""
        type: string
      merge_mode:
        # ⚠ 2026-11-21 根因修复：默认值原来是 "legacy"，
        #   导致 `${{ github.event.inputs.merge_mode || 'summary' }}` 永远取到 "legacy"
        #   （因为 legacy 非空，|| 不会回退到 summary）
        #   → merge 实际在跑 legacy = 重跑模块 main() = 完整采集 + OCR！
        #   实测 merge dahkg 卡在 [媒体] 7321 张图，预计 90 分钟 → 被 Watchdog 取消。
        #   summary = 只汇总各片产物，绝不重采集（这是设计要求的职责分离）。
        description: "merge 模式：summary=只汇总各片产物（默认，不重采集）；legacy=重跑模块（慢，仅调试用）"
        required: false
        default: "summary"
        type: choice
        options:
          - legacy
          - summary

  # ✅ 生产定时任务已启用（2026-11-20 Gate 1–5 全部通过）
  # 每天五轮（北京时间）= UTC 时区；按 317 期真实发布节奏定的档位：
  #   12:00 → 04:00Z   15:00 → 07:00Z   18:00 → 10:00Z
  #   20:10 → 12:10Z   20:40 → 12:40Z（跑完约 21:00，赶在开奖前）
  # 去掉原来的 23:00：20:50 之后的数据不需要。
  # 云端定时（2026-11-20 启用：Gate 1–5 全部通过后解除注释）
  # GitHub 服务器自己按点跑，与本机开关机无关。
  # ⚠⚠ 2026-11-22 根因修复：五档 cron 命中率实测 0/9 ⚠⚠
  # ------------------------------------------------------------------------
  # 线上实测（GitHub API 实读最近 9 次 schedule event）：
  #   预期分钟数（五档）: 0 / 0 / 0 / 15 / 40
  #   实际分钟数        : 20, 54, 14, 13, 54, 5, 3, 12, 44   ← 一个都没命中
  #   按天统计：11-16 ~ 11-19 完全 0 次；11-20 起才有，但偏差
  #            +5.7 / +194.6 / +334.7 / +453.3 分钟（完全随机）
  #
  # 根因：GitHub Actions 的 `schedule` 是 **best effort**，
  #   官方文档明确「高负载时可能延迟数十分钟甚至跳过」。
  #   低频 cron（每天 5 条）命中率极低 —— 实测 0/9。
  #
  # 修法（纯云端，绝不依赖任何本地电脑/计划任务）：
  #   · cron 改每 10 分钟（高频 cron 调度压力小、延迟小；实测高频远比低频可靠）
  #   · 新增 `gate` job 用**北京时间**判断是否该跑五档，不该跑直接 exit 0
  #   · 五档命中窗口各宽 10 分钟（覆盖 cron 延迟）：
  #       12:00-12:09 / 15:00-15:09 / 18:00-18:09 / 20:10-20:19 / 20:40-20:49
#   ⚠ 20:10 档（原设计 20:15，已改）：窗口 20:10-20:39，cron 每 5 分钟必命中，
#     而 20:20 起跑 15-20 分钟会压到 21:31 开奖，故提前到 20:10）
  #   · 仓库是 public → Actions 分钟数免费，144 次/天的空跑无成本
  # ------------------------------------------------------------------------
  # ⚠⚠ 2026-11-22 二次修复：`*/10` 实测仍然不可靠 ⚠⚠
  # ------------------------------------------------------------------------
  # 实测证据（GitHub API 实读 11 次 schedule event）：
  #   分钟数分布: :03 :05 :06 :12 :13 :14 :20 :44 :45 :54 :54
  #   我们的目标: :00 :10 :20 :30 :40 :50
  #   命中: 1 次（9%）；间隔 32 分 ~ 941 分（15.7 小时）完全随机
  #   workflow updated_at 冻结在 2026-11-19（之后 30+ 次 push 未更新）
  #
  # GitHub 官方文档原文：
  #   "The schedule event can be delayed during periods of high loads.
  #    High load times include the start of every hour.
  #    If the load is sufficiently high enough, some queued jobs may be dropped.
  #    To decrease the chance of delay, schedule your workflow to run at a
  #    different part of the hour."
  #
  # 修法（三层保障）：
  #   层1 多档兜底：每小时 12 次（每 5 分钟），**全部避开 :00 与 :30**（高负载时段）
  #       实测：最坏延迟从 15 分钟降到 5 分钟
  #   层2 自愈补跑：gate 查数据仓 manifest 判断「今天该档跑过没」，没跑就补
  #   层3 外部 cron（可选）：cron-job.org 准点调 workflow_dispatch API
  # ------------------------------------------------------------------------
  schedule:
    # 每小时 6 次，分钟数都避开了整点和半点（GitHub 高负载时段）
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'

# ⚠ 2026-11-20 根因修复：原来 group 是 crawl-<ref>，导致**所有 run 严格串行**。
# 前一个 run 若异常变慢（曾因 merge 缓存 bug 跑 73 分钟），后面的全部排队
# （实测：21:44 触发的 run 等到 22:03 才开始，空等 19.1 分钟）。
#
# 改为按「档位 + 日期」分组：
#   · 同一档位（同一天同一个 slot）→ 仍串行，防重复触发
#   · 不同档位（12:00 / 15:00 / 18:00 / 20:10 / 20:40）→ 各自独立，互不排队
#   · 手动触发（无 slot）→ 用 run_id，完全不排队
#
# 数据安全：publish 步骤用 git pull --rebase，且数据仓是 append-only（每期一个文件），
# 并发推送冲突概率极低；万一冲突该 run publish 失败，不会损坏已有数据。
concurrency:
  group: crawl-${{ github.ref }}-${{ github.event.inputs.slot || github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"      # cloud/core/*.pyc 是 3.13 编译（magic f30d0d0a），必须一致
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONIOENCODING: "utf-8"
  # 每源分片数（唯一事实源）：plan 用它算「按累计图片数」的均衡分组，
  # shard job 的 matrix 用它取下标 —— 两处必须同源，否则分组与下标对不上。
  SHARD_MAP: "dahkg:13,aocai:5,tuku:2"

jobs:
  # ---------------- JobG：定时闸门（高频 cron + 北京时间判断五档）----------------
  # ⚠ 2026-11-22 根因修复：GitHub 的 schedule 是 best effort，
  #   低频 cron（每天 5 条）实测命中率 0/9（分钟数完全错位，偏差最远 453 分钟）。
  #   改成每 10 分钟跑一次 + 在这里用**北京时间**判断是否命中五档窗口。
  #   这是**纯云端**方案，与本地电脑开关机无关（用户铁律）。
  gate:
    name: "JobG 定时闸门"
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      slot: ${{ steps.gate.outputs.slot }}
    steps:
      - name: 判断是否命中五档（窗口 + 自愈补跑）
        id: gate
        env:
          DATA_TOKEN: ${{ secrets.LIUHE_DATA_TOKEN }}
          # 查「有没有在跑的 run」需要读 actions:read
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # ⚠ 2026-11-23 修正（审查发现 L4：原来这里 exit 0，导致 dispatch 触发时
          #   防重复 / 窗口判断 / 自愈补跑**全部失效**）。
          #   而生产恰恰是 alarm.yml 用 workflow_dispatch 驱动 →
          #   实测 alarm run 45077315014 卡 3h53m 未回收，11:00 档整档缺失。
          #
          #   现在：dispatch 不再提前退出，只是打上 IS_MANUAL=1 标志，
          #   后续「查在跑 run」照常执行（防重复），窗口判断时直接放行（允许随时手补）。
          IS_MANUAL=0
          MANUAL_SLOT=""
          if [ "${{ github.event_name }}" != "schedule" ]; then
            IS_MANUAL=1
            MANUAL_SLOT="${{ github.event.inputs.slot || '' }}"
            echo "手动/外部触发（${{ github.event_name }}）→ 标记为手动，仍需通过防重复检查"
          fi

          # ------------------------------------------------------------------
          # ⚠ 2026-11-23 主动排查修复：先查「有没有正在跑的 run」
          # ------------------------------------------------------------------
          # 隐患：cron 触发时 concurrency group 退化成 run_id → 完全不串行。
          #   12:05 开跑（~15 分钟），12:15 又触发 → gate 查 manifest 发现还没更新
          #   → 判「该档没跑」→ 重复开跑 → 两轮同时 publish → git push 冲突。
          # 修法：直接查 GitHub API「有没有 in_progress 的 crawl.yml run」，
          #   有就跳过。这是**事实判断**，不是推算。
          GH_TOKEN="${GITHUB_TOKEN:-}"
          REPO_SLUG="${GITHUB_REPOSITORY:-}"
          SELF_RUN="${GITHUB_RUN_ID:-0}"
          if [ -n "$GH_TOKEN" ] && [ -n "$REPO_SLUG" ]; then
            RUNNING=$(curl -sS --max-time 30               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$REPO_SLUG/actions/workflows/crawl.yml/runs?status=in_progress&per_page=20"               2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);s=[r for r in (d.get('workflow_runs') or []) if str(r.get('id'))!='$SELF_RUN'];print(len(s))" 2>/dev/null || echo "-1")
            echo "在跑的 run 数（除自己）= ${RUNNING}"
            if [ "$RUNNING" = "-1" ]; then
              echo "⚠ 查不到在跑 run（API 失败），按无并发继续"
            elif [ "$RUNNING" -gt 0 ]; then
              echo "⏭ 已有 $RUNNING 个 run 在跑 → 跳过本轮（避免重复跑 + push 冲突）"
              echo "should_run=0" >> "$GITHUB_OUTPUT"
              echo "slot=busy" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # 北京时间（GitHub runner 是 UTC，用 TZ 转换）
          NOW_H=$(TZ=Asia/Shanghai date +%-H)
          NOW_M=$(TZ=Asia/Shanghai date +%-M)
          NOW_YMD=$(TZ=Asia/Shanghai date '+%Y-%m-%d')
          NOW_S=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          NOW_EPOCH=$(TZ=Asia/Shanghai date +%s)
          echo "当前北京时间: $NOW_S"

          # ------------------------------------------------------------------
          # 五档定义（分钟数从 0 点起的偏移）
          #   12:00 → 720    15:00 → 900    18:00 → 1080
          #   20:10 → 1210   20:40 → 1240
          # ------------------------------------------------------------------
          SLOTS_MIN="720 900 1080 1210 1240"
          SLOTS_NAME="12:00 15:00 18:00 20:10 20:40"
          NOW_MIN=$(( NOW_H * 60 + NOW_M ))

          # ① 窗口内（±10 分钟）→ 直接放行
          # ⚠ 2026-11-23 用户要求「没触发也要几分钟内补上」：
          #   WIN 从 10 放宽到 29（档后 30 分钟内任何触发都算正常命中）。
          #   配合 cron 每 5 分钟一次，最坏延迟 = 5 分钟。
          #   边界验证：720+29=749 < 900；900+29=929 < 1080；
          #            1080+29=1109 < 1210；1210+29=1239 < 1240 ✅ 均不重叠
          WIN=29
          HIT_NAME=""
          i=0
          for sm in $SLOTS_MIN; do
            i=$((i+1))
            nm=$(echo "$SLOTS_NAME" | cut -d' ' -f$i)
            if [ "$NOW_MIN" -ge "$sm" ] && [ "$NOW_MIN" -le $((sm + WIN)) ]; then
              HIT_NAME="$nm"
              break
            fi
          done
          if [ -n "$HIT_NAME" ]; then
            echo "✅ 命中五档窗口 $HIT_NAME → 放行"
            echo "should_run=1" >> "$GITHUB_OUTPUT"
            echo "slot=$HIT_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 手动/外部触发（IS_MANUAL=1）：不要求落在窗口内，直接放行
          # slot 优先用 inputs.slot，否则用「最接近的已过档位」标注
          if [ "$IS_MANUAL" = "1" ]; then
            if [ -n "$MANUAL_SLOT" ]; then
              SLOT_OUT="$MANUAL_SLOT"
            else
              SLOT_OUT="manual"
              i=0
              for sm in $SLOTS_MIN; do
                i=$((i+1))
                nm=$(echo "$SLOTS_NAME" | cut -d' ' -f$i)
                if [ "$NOW_MIN" -ge "$sm" ]; then SLOT_OUT="$nm"; fi
              done
            fi
            echo "手动/外部触发 → 放行（slot=$SLOT_OUT，不要求落在窗口内）"
            echo "should_run=1" >> "$GITHUB_OUTPUT"
            echo "slot=$SLOT_OUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "未在五档窗口内（当前 $NOW_MIN 分，窗口 5 个），检查是否需要补跑…"

          # ② 自愈补跑：查数据仓 manifest 的 generatedAt，判断今天跑过哪一档
          LAST_TS=""
          if [ -n "${DATA_TOKEN:-}" ]; then
            BODY=$(curl -sS --max-time 30 -H "Authorization: Bearer $DATA_TOKEN" -H "Accept: application/vnd.github.raw" "https://api.github.com/repos/wangpha/liuhe-data/contents/manifest.json" 2>/dev/null || true)
            LAST_TS=$(echo "$BODY" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('generatedAt') or '')" 2>/dev/null || true)
          fi
          echo "数据仓 manifest.generatedAt = ${LAST_TS:-（取不到）}"

          # generatedAt 形如 2026-11-21T22:30:59+0000（UTC）→ 转北京时间
          LAST_MIN_OF_DAY=""
          LAST_YMD=""
          if [ -n "$LAST_TS" ]; then
            # 用 date 解析（-d 支持的格式：2026-11-21T22:30:59+0000）
            if LAST_BJ=$(TZ=Asia/Shanghai date -d "$LAST_TS" '+%Y-%m-%d %H:%M' 2>/dev/null); then
              LAST_YMD=$(echo "$LAST_BJ" | cut -d' ' -f1)
              LH=$(echo "$LAST_BJ" | cut -d' ' -f2 | cut -d: -f1)
              LM=$(echo "$LAST_BJ" | cut -d' ' -f2 | cut -d: -f2)
              LAST_MIN_OF_DAY=$(( 10#$LH * 60 + 10#$LM ))
              echo "  解析为北京 $LAST_BJ（当日第 $LAST_MIN_OF_DAY 分）"
            fi
          fi

          # 找「已过窗口 + 今天没跑」的最早一档来补跑
          NEED_NAME=""
          i=0
          for sm in $SLOTS_MIN; do
            i=$((i+1))
            nm=$(echo "$SLOTS_NAME" | cut -d' ' -f$i)
            # 该档窗口已过（now > slot + WIN）
            if [ "$NOW_MIN" -le $((sm + WIN)) ]; then
              continue
            fi
            # 该档是否已跑：manifest 是今天的 且 时间 >= 该档
            _same_day=0
            if [ -n "$LAST_YMD" ] && [ "$LAST_YMD" = "$NOW_YMD" ]; then _same_day=1; fi
            _ran_this=0
            if [ "$_same_day" = "1" ] && [ -n "$LAST_MIN_OF_DAY" ] && [ "$LAST_MIN_OF_DAY" -ge "$sm" ]; then _ran_this=1; fi
            if [ "$_ran_this" = "1" ]; then
              continue
            fi
            NEED_NAME="$nm"
            break
          done

          if [ -n "$NEED_NAME" ]; then
            echo "🔁 自愈补跑：$NEED_NAME 档今天还没跑过 → 补跑"
            echo "should_run=1" >> "$GITHUB_OUTPUT"
            echo "slot=${NEED_NAME}(补跑)" >> "$GITHUB_OUTPUT"
          else
            echo "⏭ 五档都已跑过或未到时间 → 跳过本轮"
            echo "should_run=0" >> "$GITHUB_OUTPUT"
            echo "slot=none" >> "$GITHUB_OUTPUT"
          fi

  # ---------------- JobP：决定跑哪些源 + 每源分片数 ----------------
  plan:
    name: "JobP 计划"
    needs: gate
    if: needs.gate.outputs.should_run == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sources: ${{ steps.pick.outputs.sources }}
      shards_dahkg: ${{ steps.pick.outputs.shards_dahkg }}
      count_dahkg: ${{ steps.pick.outputs.count_dahkg }}
      shards_aocai: ${{ steps.pick.outputs.shards_aocai }}
      count_aocai: ${{ steps.pick.outputs.count_aocai }}
      shards_tuku: ${{ steps.pick.outputs.shards_tuku }}
      count_tuku: ${{ steps.pick.outputs.count_tuku }}
    steps:
      - name: 计算源列表与分片数
        id: pick
        env:
          # ⚠ 2026-11-20 根因修复：`github.event.inputs.source` 只在 workflow_dispatch 时有值，
          # schedule 触发时为空 → 原来的 `|| 'tuku'` 会让 cron 只跑 tuku 一个源
          # （实测 schedule run 44767982757：dahkg/aocai 全部 skipped）。
          # 改成：定时触发跑全部三源，手动触发用用户选的。
          REQ: ${{ github.event_name == 'schedule' && 'all' || github.event.inputs.source || 'all' }}
        run: |
          echo "请求源: $REQ"
          case "$REQ" in
            all) echo 'sources=["tuku","aocai","dahkg"]' >> "$GITHUB_OUTPUT" ;;
            tuku|aocai|dahkg) echo "sources=[\"$REQ\"]" >> "$GITHUB_OUTPUT" ;;
            *) echo "未知源: $REQ" >&2; exit 2 ;;
          esac
          python -c "import json;n=13;print('shards_dahkg='+json.dumps(list(range(n))));print('count_dahkg='+str(n))" >> "$GITHUB_OUTPUT"
          python -c "import json;n=5;print('shards_aocai='+json.dumps(list(range(n))));print('count_aocai='+str(n))" >> "$GITHUB_OUTPUT"
          python -c "import json;n=2;print('shards_tuku='+json.dumps(list(range(n))));print('count_tuku='+str(n))" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # ---------------- Job 0：清理（图片 2 天轮转 + 产物 30 期轮转）----------------
  cleanup:
    name: "Job0 cleanup 轮转"
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: repo
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 检出私有数据仓
        uses: actions/checkout@v4
        with:
          repository: wangpha/liuhe-data
          token: ${{ secrets.LIUHE_DATA_TOKEN }}
          path: repo/work/store
      - name: 清理轮转（图片 2 天 / 产物 30 期）
        working-directory: repo
        run: |
          set -o pipefail
          python -m cloud.runner --cleanup --work work --store work/store --keep-days 2 --keep-periods 30 2>&1 | tee work/cleanup.log
      - name: 提交轮转结果
        working-directory: repo/work/store
        run: |
          git config user.name  "liuhe-bot"
          git config user.email "liuhe-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "无变化"; else
            git commit -m "cleanup: 图片2天/产物30期轮转 $(date -u +%Y-%m-%dT%H:%M:%SZ)"; git push; fi
      - name: 保存清理日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-log-${{ github.run_id }}
          path: repo/work/cleanup.log
          if-no-files-found: warn

  # ---------------- Job 1：逐源 plan（期号探测，三源口径不同）----------------
  prepare:
    name: "计划 ${{ matrix.source }}"
    needs: [plan, cleanup]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.sources) }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: repo
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 检出私有数据仓（读状态）
        uses: actions/checkout@v4
        with:
          repository: wangpha/liuhe-data
          token: ${{ secrets.LIUHE_DATA_TOKEN }}
          path: repo/work/store
      - name: 安装依赖
        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cloud/requirements.txt
      - name: 生成 plan（含期号探测证据）
        working-directory: repo
        run: |
          set -o pipefail
          python -m cloud.runner --plan --source "${{ matrix.source }}" \
            --work work --state work/store/state --period "${{ github.event.inputs.period || '0' }}" --slot "${{ needs.gate.outputs.slot || github.event.inputs.slot || '' }}" 2>&1 | tee "work/plan_${{ matrix.source }}.log"
      - name: 失败/超时诊断（写 Step Summary）
        if: failure()
        run: |
          echo "## ⏱ 失败/超时诊断" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -30 work/plan_${{ matrix.source }}.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '\[详情\]|\[OCR\]|\[图片\]|\[plan\]|\[merge\]' work/plan_${{ matrix.source }}.log 2>/dev/null | tail -5 >> "$GITHUB_STEP_SUMMARY" || true
      - name: 上传 plan
        uses: actions/upload-artifact@v4
        with:
          name: plans-${{ matrix.source }}-${{ github.run_id }}
          path: |
            repo/work/plan
            repo/work/plan_${{ matrix.source }}.log
          if-no-files-found: error

  # ---------------- 分片 dahkg：#=0..12 （并行预热缓存）----------------
  shard_dahkg:
    name: "分片 dahkg#${{ matrix.shard }}"
    needs: [plan, prepare]
    if: contains(needs.plan.outputs.sources, 'dahkg') && github.event.inputs.no_shard != 'true'
    runs-on: ubuntu-24.04
    # 硬超时保护：实测 runner CPU 异构（AMD EPYC 0.37s/图 vs Intel 6975P 1.95s/图，
    # 差 5.3 倍），慢机会把单片拖到 25 分钟以上。这里封顶 18 分钟；
    # runner 内部还有 16 分钟「软超时」：到点把剩余帖子写 unfinished_*.json 后正常退出，
    # 剩余工作交给 merge 补抓（见 runner.py 的 watchdog）。
    # 硬超时 25。分片容量由 runner 的 cloud/budget.py 按「本 job timeout × 0.6」算
    # （= 15 分钟）。为什么不是 0.9：整轮 = 固定 + 最慢分片 + merge，
    # 0.9 时 dahkg 实测 7+23.7+10 = 40.7 分撞 watchdog 40 分 → publish 被跳过。
    timeout-minutes: 25
    # 分片只是「预热缓存」，**正确性由 merge 的全量重采 + 五道防线保证**。
    # 2026-11-17 事故：跨期时若干分片报「没有 X 期的帖子」→ 整个 run 变 failure → publish 被跳过，
    # 当天数据没进数据仓。所以这里让分片失败**不连累整轮**：
    # 分片失败 = 那部分缓存没预热（merge 多花点时间重采），不影响产物正确性。
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards_dahkg) }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: repo
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 安装系统依赖（opencv 需要 libGL）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: 恢复 pip 缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('repo/cloud/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - name: 安装依赖
        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cloud/requirements.txt
          python -c "import rapidocr_onnxruntime, onnxruntime, cv2, openpyxl, Crypto; print('deps ok', onnxruntime.__version__, cv2.__version__)"
      - name: 下载本源 plan
        uses: actions/download-artifact@v4
        with:
          name: plans-dahkg-${{ github.run_id }}
          path: repo/work/plan-dl
      - name: 归位 plan
        working-directory: repo
        run: |
          mkdir -p work/plan
          cp -v work/plan-dl/plan/*.json work/plan/ 2>/dev/null || true
          find work/plan-dl -name 'plan_*.json' -exec cp -v {} work/plan/ \;
          ls -la work/plan
      - name: 读取本片期号（供缓存分层用）
        id: period
        working-directory: repo
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json
          fs = glob.glob("work/plan/plan_*.json")
          p = 0
          if fs:
              p = int((json.load(open(fs[0], encoding="utf-8")).get("period") or 0))
          print("period=" + str(p))
          PY
      - name: 恢复元数据缓存（层1·按期隔离）
        uses: actions/cache@v4
        with:
          path: repo/work/meta-cache
          key: ocr-meta-p${{ steps.period.outputs.period }}-${{ matrix.shard }}-dahkg-${{ github.event.inputs.cache_buster || '0' }}-${{ github.run_id }}
          restore-keys: |
            ocr-meta-p${{ steps.period.outputs.period }}-${{ matrix.shard }}-dahkg-${{ github.event.inputs.cache_buster || '0' }}-
      # ⚠ 2026-11-21 架构修正（run 44858821213 实测教训）：
      #   上一版把缓存 save 放在 merge，结果 merge 要压缩上传 20+ 万文件，
      #   耗时 16.8 分被 Watchdog 取消 —— 和之前删掉的 ocr-merge-v3 同一坑。
      #   正确做法：**分片自己 save 自己那份**，key 带 matrix.shard → 13 片互不冲突。
      #   为什么这样就够：plan 按「用户」分组，同一作者的所有帖子恒在同一片，
      #   帖子归属稳定 → 分片自己的 cache 天然覆盖它处理过的全部帖子，
      #   不需要 merge 汇总后再分发。
      - name: 恢复本片 OCR 缓存（key 带片号，13 片互不冲突）
        uses: actions/cache@v4
        with:
          path: repo/work/ocr-cache
          key: ocr-pool-dahkg-sh${{ matrix.shard }}-v4-${{ github.run_id }}
          restore-keys: |
            ocr-pool-dahkg-sh${{ matrix.shard }}-v4-
      - name: 把两层缓存铺回各 .cache 目录
        working-directory: repo
        run: |
          PERIOD="${{ steps.period.outputs.period }}"
          mkdir -p "work/meta-cache/$PERIOD" work/ocr-cache/ocr
          # ⚠ 2026-11-21 根因修复（run 44906863761 实测「铺回 0 个 .cache」）：
          #   分片刚启动时 work/out 是空的（还没跑采集 → 没有期目录 → 没有 .cache）
          #   → find 返回 0 个目录 → 缓存一个都没铺进去
          #   → OCR 结果留在 work/ocr-cache/ocr/ 但没人读
          #   → 采集时全部重新 OCR → 2030 图 × 1 秒 = 34 分钟 → SIGTERM
          #   修法：先按「源+期号」预建期目录和 .cache/ocr，再铺回。
          SRC="dahkg"
          SUB="大港澳"
          # 期号可能是 2026325 或 325，两种目录名都建（同一个位置，取短的）
          P3=$(echo "$PERIOD" | sed 's/^2026//')
          [ -z "$P3" ] && P3="$PERIOD"
          mkdir -p "work/out/$SUB/澳门_2026_${P3}期/.cache/ocr"
          n=0
          for d in $(find work/out -type d -name .cache 2>/dev/null); do
            [ -d "$d" ] || continue
            cp -n "work/meta-cache/$PERIOD/"*.json "$d/" 2>/dev/null || true
            mkdir -p "$d/ocr"
            cp -n work/ocr-cache/ocr/*.json "$d/ocr/" 2>/dev/null || true
            n=$((n+1))
          done
          echo "铺回 $n 个 .cache（meta 期号=$PERIOD / OCR $(ls work/ocr-cache/ocr 2>/dev/null | wc -l) 个文件）"
          echo "预建目录：work/out/$SUB/澳门_2026_${P3}期/.cache/ocr ($(ls work/out/$SUB/澳门_2026_${P3}期/.cache/ocr 2>/dev/null | wc -l) 个)"
      - name: 分片预热（只处理本片：详情+回复+图片+OCR）
        id: shard
        working-directory: repo
        env:
          NO_OCR: ${{ github.event.inputs.no_ocr || 'false' }}
          NO_IMAGES: ${{ github.event.inputs.no_images || 'false' }}
          # OCR 进程数（2026-11-20 A/B 验证）：1=串行（安全），2=双进程（1.40x，需 core/ocr.py 的 fork reset 修复）
          QODE_OCR_PROCS: ${{ github.event.inputs.ocr_procs || '2' }}
        run: |
          set -o pipefail
          # SIGTERM 优雅投降（2026-11-19）：1200s(20 分) 远小于 job timeout 1500s(25 分)
          # ⚠ 2026-11-19 实测教训：原写 1440s(24 分)，但 timeout 是**相对本 step 开始**算的，
          #   而前置步骤（检出/装依赖/恢复缓存）占 ~1 分钟 → 1+24 ≈ 25 = job timeout，两者竞争，
          #   有时 job timeout 先 SIGKILL → handler 没机会跑（日志里连「收到 SIGTERM」都没有）。
          #   改成 1200s(20 分) → 1+20 = 21 分 < 25 分，稳。分片容量 15 分钟（USABLE_RATIO=0.6）也够。
          # --kill-after=30：若 SIGTERM 30 秒内没退，再 SIGKILL 兜底。
          SHARD_TO="timeout --signal=SIGTERM --kill-after=30 1200"
          EXTRA=""
          [ "$NO_OCR" = "true" ] && EXTRA="$EXTRA --no-ocr"
          [ "$NO_IMAGES" = "true" ] && EXTRA="$EXTRA --no-images"
          set +e
          $SHARD_TO python -m cloud.runner --shard "${{ matrix.shard }}" \
            --shards "${{ needs.plan.outputs.count_dahkg }}" \
            --source "dahkg" --work work --out work/out --workers 8 \
            $EXTRA 2>&1 | tee "work/shard_dahkg_${{ matrix.shard }}.log"
            code=$?
            set -e
            if [ "$code" -eq 124 ] || [ "$code" -eq 143 ]; then
              echo "::warning::分片被 SIGTERM（24 分钟预算用完）→ 按优雅退出处理（unfinished 已由 runner 写出）"
              exit 0
            fi
            exit $code
      - name: 收集两层缓存（meta 按期 / OCR 跨期）
        if: always()
        working-directory: repo
        run: |
          PERIOD="${{ steps.period.outputs.period }}"
          mkdir -p "work/meta-cache/$PERIOD" work/ocr-cache/ocr
          for d in $(find work/out -type d -name .cache 2>/dev/null); do
            [ -d "$d" ] || continue
            cp -f "$d"/*.json "work/meta-cache/$PERIOD/" 2>/dev/null || true
            cp -f "$d"/ocr/*.json work/ocr-cache/ocr/ 2>/dev/null || true
          done
          echo "meta($PERIOD): $(ls work/meta-cache/$PERIOD 2>/dev/null | wc -l) 个；ocr: $(ls work/ocr-cache/ocr 2>/dev/null | wc -l) 个"
      - name: 缓存体积检查（超 500MB 才瘦身）
        if: always()
        working-directory: repo
        run: |
          # 方案 3 改动 4：分片 artifact **保留图片**（约 200MB/片），
          # 让 merge 直接合并、不重新下载（实测重下会把合并从 12 分拖到 15 分）。
          # 安全网：存缓存前量一下体积，超过 500MB 才删图片，防止某期图片暴增打爆 10GB 额度。
          size_mb=$(du -sm work/out 2>/dev/null | cut -f1 || echo 0)
          echo "本片输出体积：${size_mb}MB（阈值 500MB）"
          if [ "${size_mb:-0}" -gt 500 ]; then
            echo "::warning::超过 500MB，执行瘦身（只留 .cache），避免撑爆 actions/cache 额度"
            find work/out -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' \) -delete 2>/dev/null || true
            after=$(du -sm work/out 2>/dev/null | cut -f1 || echo 0)
            echo "瘦身后：${after}MB"
          else
            echo "未超阈值，图片保留在 artifact 里（merge 无需重下）"
          fi
      - name: 失败/超时诊断（写 Step Summary）
        if: failure()
        run: |
          echo "## ⏱ 失败/超时诊断" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -30 work/shard_dahkg_${{ matrix.shard }}.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '\[详情\]|\[OCR\]|\[图片\]|\[shard\]' work/shard_dahkg_${{ matrix.shard }}.log 2>/dev/null | tail -5 >> "$GITHUB_STEP_SUMMARY" || true
      - name: 打包本片缓存
        if: always()
        working-directory: repo
        run: |
          mkdir -p work/cacheout
          # ① 元数据/OCR 缓存（原有）
          # ⚠ 2026-11-23 主动排查修复（deepcheck_tuku_detail.py 实测）：
          #   aocai 的 threads.json、tuku 的 details.json/replies.json 会随 .cache 打包，
          #   下一轮 restore 后详情缓存跨轮生效且无 TTL → 帖子更新（新图/新文字）看不到。
          #   修法：只打 OCR 结果（按 sha256 索引，跨轮复用安全），排除详情缓存。
          ( cd work/out && find . -type d -name .cache -print0 2>/dev/null \
            | tar -czf ../../work/cacheout/cache_dahkg_${{ matrix.shard }}.tar.gz --exclude='*threads.json' --exclude='*details.json' --exclude='*replies.json' --exclude='*dahkg_threads.json' --null -T - 2>/dev/null )             || echo "没有 .cache 可打包（本片可能是空片）"
          # ② 产物（C1-中 新增）：分片已经生成了 posts.json 等产物，只是之前没打包
          #    只打文本类产物，图片仍走 .cache 里的副本，避免 artifact 膨胀
          ( cd work/out && find . -maxdepth 3 -type f \
              -not -path '*/.cache/*' \
              \( -name '*.json' -o -name '*.csv' -o -name '*.html' \
                 -o -name '*.txt' -o -name '*.xlsx' -o -name '*.md' \) -print0 2>/dev/null \
            | tar -czf ../../work/cacheout/products_dahkg_${{ matrix.shard }}.tar.gz --null -T - 2>/dev/null ) \
            || echo "没有产物可打包"
          echo "--- cacheout 内容 ---"
          ls -la work/cacheout
          for f in work/cacheout/products_dahkg_${{ matrix.shard }}.tar.gz; do
            [ -f "$f" ] && echo "产物包 $(basename "$f"): $(du -m "$f" | cut -f1) MB / $(tar -tzf "$f" | wc -l) 个文件"
          done
      - name: 上传本片缓存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-dahkg-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            repo/work/cacheout
            repo/work/shards
            repo/work/shard_dahkg_${{ matrix.shard }}.log
            repo/work/unfinished
          if-no-files-found: warn

  # ---------------- 分片 aocai：#=0..4 （并行预热缓存）----------------
  shard_aocai:
    name: "分片 aocai#${{ matrix.shard }}"
    needs: [plan, prepare]
