          python -m cloud.runner --merge --source "dahkg" --work work --out work/out \
            --state work/store/state --workers 8 $EXTRA --period "${{ github.event.inputs.period || '0' }}" --merge-mode "${{ github.event.inputs.merge_mode || 'legacy' }}" 2>&1 | tee "work/run_dahkg.log"
