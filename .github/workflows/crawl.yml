          ( cd work/out && find . -maxdepth 3 -type f \
              -not -path '*/.cache/*' \
              \( -name '*.json' -o -name '*.csv' -o -name '*.html' \
                 -o -name '*.txt' -o -name '*.xlsx' -o -name '*.md' \) -print0 2>/dev/null \
            | tar -czf ../../work/cacheout/products_tuku_${{ matrix.shard }}.tar.gz --null -T - 2>/dev/null ) \
            || echo "没有产物可打包"
          echo "--- cacheout 内容 ---"
          ls -la work/cacheout
          for f in work/cacheout/products_tuku_${{ matrix.shard }}.tar.gz; do
            [ -f "$f" ] && echo "产物包 $(basename "$f"): $(du -m "$f" | cut -f1) MB / $(tar -tzf "$f" | wc -l) 个文件"
          done
      - name: 上传本片缓存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-tuku-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            repo/work/cacheout
            repo/work/shards
            repo/work/shard_tuku_${{ matrix.shard }}.log
            repo/work/unfinished
          if-no-files-found: warn

  # ---------------- 合并 dahkg：解开各片缓存后完整跑一次 ----------------
  merge_dahkg:
    name: "合并 dahkg"
    needs: [gate, plan, prepare, shard_dahkg]
    # 必须带源过滤：只跑本次选中的源，否则 tuku-only 运行会把 dahkg/aocai 的 merge 也拉起来（白跑几小时）
    if: needs.gate.outputs.should_run == '1' && always() && !cancelled() && contains(needs.plan.outputs.sources, 'dahkg')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: repo
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 检出私有数据仓（读状态：期号/快照）
        uses: actions/checkout@v4
        with:
          repository: wangpha/liuhe-data
          token: ${{ secrets.LIUHE_DATA_TOKEN }}
          path: repo/work/store
      - name: 安装系统依赖（opencv 需要 libGL）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: 恢复 pip 缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('repo/cloud/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - name: 安装依赖
        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cloud/requirements.txt
      - name: 下载本源 plan（含内容指纹 + 分片分配）
        uses: actions/download-artifact@v4
        with:
          name: plans-dahkg-${{ github.run_id }}
          path: repo/work/plan-dl
      - name: 归位 plan（merge 用 postHashes 做内容指纹快照与回复数对账）
        working-directory: repo
        run: |
          mkdir -p work/plan
          find work/plan-dl -name 'plan_*.json' -exec cp -v {} work/plan/ \;
          ls -la work/plan
      - name: 下载各分片缓存
        uses: actions/download-artifact@v4
        with:
          pattern: cache-dahkg-*-${{ github.run_id }}
          path: repo/work/incoming-cache
      - name: 解开各分片缓存到独立目录（不能直接解到 work/out，否则同名 JSON 互相覆盖）
        working-directory: repo
        run: |
          rm -rf work/cache-in && mkdir -p work/cache-in work/out
          n=0
          for f in $(find work/incoming-cache -name 'cache_*.tar.gz' -type f 2>/dev/null); do
            name=$(basename "$f" .tar.gz)
            mkdir -p "work/cache-in/$name"
            tar -xzf "$f" -C "work/cache-in/$name"
            n=$((n+1))
          done
          echo "共解开 $n 份分片缓存到 work/cache-in/"
          find work/cache-in -maxdepth 1 -mindepth 1 -type d | head -20
      # ⚠️ 2026-11-20 根因修复：这里原本是
      #     uses: actions/cache@v4
      #     with: { path: repo/work/out, key: ocr-merge-v3-dahkg-<bust>-<run_id> }
      # 导致合并 job 稳定 25-26 分钟超时：
      #   · work/out 是完整产物目录（含图片），几个 GB、几十万文件
      #   · actions/cache 在 job 结束时要压缩上传 → 20+ 分钟
      #   · key 带 run_id → 永远 miss，等于每次白等 + 白传
      # 这一层缓存是多余的：分片产物已由 download-artifact 落到 work/cache-in，
      # merge_caches.py 会重建 work/out。故整段删除。
      - name: 合并分片缓存（details/replies/threads/list 按 key 取并集，OCR 按文件名复制）
        working-directory: repo
        run: |
          set -o pipefail
          python cloud/merge_caches.py --target work/out --sources work/cache-in/* 2>&1 | tee work/merge_caches.log
      - name: 清理昨日图片（R2）
        working-directory: repo
        run: |
          set -o pipefail
          python -m cloud.runner --cleanup --work work --out work/out --keep-days 2 --skip-periods 2>&1 | tee work/images_cleanup.log
      - name: 汇总产物（summary 模式：只汇总不重采集）+ 五道防线校验
        id: merge
        working-directory: repo
        env:
          LIUHE_CLOUD_WORK: work
          NO_OCR: ${{ github.event.inputs.no_ocr || 'false' }}
          NO_IMAGES: ${{ github.event.inputs.no_images || 'false' }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: |
          set -o pipefail
          EXTRA=""
          [ "$NO_OCR" = "true" ] && EXTRA="$EXTRA --no-ocr"
          [ "$NO_IMAGES" = "true" ] && EXTRA="$EXTRA --no-images"
          [ "$LIMIT" != "0" ] && EXTRA="$EXTRA --limit $LIMIT"
          python -m cloud.runner --merge --source "dahkg" --work work --out work/out \
            --state work/store/state --workers 8 $EXTRA --period "${{ github.event.inputs.period || '0' }}" --merge-mode "${{ github.event.inputs.merge_mode || 'summary' }}" 2>&1 | tee "work/run_dahkg.log"
      - name: 失败/超时诊断（写 Step Summary）
        if: failure()
        run: |
          echo "## ⏱ 失败/超时诊断" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -30 work/run_dahkg.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '\[详情\]|\[OCR\]|\[图片\]|\[plan\]|\[merge\]' work/run_dahkg.log 2>/dev/null | tail -5 >> "$GITHUB_STEP_SUMMARY" || true
      - name: 日志零错误审计（文档 6B.3 方式 1）
        if: always()
        working-directory: repo
        run: |
          LOG="work/run_dahkg.log"
          if [ -f "$LOG" ]; then
            python cloud/audit_logs.py "$LOG" --json "work/audit/logaudit_dahkg.json" || true
          fi
      - name: 汇总产物清单
        if: always()
        working-directory: repo
        run: |
          find work/out -maxdepth 3 -type d -name '*期' > work/_periods.txt 2>/dev/null || true
          while read -r d; do [ -n "$d" ] || continue; echo "$d : $(find "$d" -maxdepth 1 -type f | wc -l) 个文件"; done < work/_periods.txt
          du -sh work/out 2>/dev/null || true
      - name: 上传日志与审计证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-dahkg-${{ github.run_id }}
          path: |
            repo/work/run_dahkg.log
            repo/work/audit
            repo/work/state
            repo/work/plan
            repo/work/images_cleanup.log
          if-no-files-found: warn
      # ⚠ 2026-11-21 新增（用户核心要求）：merge 汇总后把缓存存回 actions/cache。
      #   否则合并结果随 runner 销毁而丢失 → 下轮分片 restore 到的还是旧快照。
      #   ⚠ 但**不能**直接缓存 `work/out/**/.cache`：
      #     实测 run 44858821213 匹配到 22 个期目录、20+ 万文件，
      #     压缩上传 15+ 分钟 → merge 被 Watchdog 取消。
      #   改为：先把**当期**的 .cache 汇总到独立目录 work/pool，
      #     只缓存这个目录（当期约 10-40 MB，秒级完成）。
      # ⚠ 2026-11-21：merge **不保存 cache**。
      #   上一版在这里 save 全局池 → 要压缩上传 20+ 万 OCR 文件，
      #   实测耗时 16.8 分被 Watchdog 取消（与已删除的 ocr-merge-v3 同一坑）。
      #   缓存改由各分片自己 save（key 带片号，无冲突）。
      - name: 上传产物（数据类，不含图片）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: products-dahkg-${{ github.run_id }}
          path: |
            repo/work/out
            !repo/work/out/**/images/**
          if-no-files-found: warn

