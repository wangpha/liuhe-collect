          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -30 work/shard_aocai_${{ matrix.shard }}.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '\[详情\]|\[OCR\]|\[图片\]|\[shard\]' work/shard_aocai_${{ matrix.shard }}.log 2>/dev/null | tail -5 >> "$GITHUB_STEP_SUMMARY" || true
