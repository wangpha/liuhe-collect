name: 闹钟 has_newer 透视（把 python 的 stdin 与异常原样打出）

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 透视 has_newer
        shell: bash
        run: |
          set -uo pipefail
          echo '{"workflow_runs":[{"id":900,"name":"闹钟（每 20 秒轮询档位）"}]}' > /tmp/runs.json
          GH_TOKEN=x
          GITHUB_REPOSITORY=wangpha/liuhe-collect
          GITHUB_RUN_ID=500

          echo "===== ① 原样复刻 alarm.yml 的结构（只把 curl 换成 cat，去掉 2>/dev/null）====="
          NEWER_ID=$(cat /tmp/runs.json \
            -H "Authorization: Bearer $GH_TOKEN" \
            2>/dev/null | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
          except Exception as e:
              sys.stderr.write('EXC=%r\n' % e); print(''); raise SystemExit(0)
          me = int('$GITHUB_RUN_ID' or 0)
          sys.stderr.write('DBG me=%r\n' % me)
          ids = []
          for r in (d.get('workflow_runs') or []):
              rid = int(r.get('id') or 0)
              if rid <= me:
                  continue
              if '自测' in str(r.get('name') or ''):
                  continue
              ids.append(rid)
          print(ids[0] if ids else '')
          " || echo "")
          echo "① NEWER_ID=[$NEWER_ID]"

          echo
          echo "===== ② 同上但 stdin 不带 curl 的 -H 参数（怀疑 -H 被 cat 当文件名）====="
          NEWER_ID2=$(cat /tmp/runs.json \
            2>/dev/null | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
          except Exception as e:
              sys.stderr.write('EXC=%r\n' % e); print(''); raise SystemExit(0)
          me = int('$GITHUB_RUN_ID' or 0)
          ids = [int(r.get('id') or 0) for r in (d.get('workflow_runs') or [])
                 if int(r.get('id') or 0) > me and '自测' not in str(r.get('name') or '')]
          print(ids[0] if ids else '')
          " || echo "")
          echo "② NEWER_ID=[$NEWER_ID2]"

          echo
          echo "===== ③ 真实 curl 的参数形态：-H 的值被 cat 当成文件了吗 ====="
          cat /tmp/runs.json -H "Authorization: Bearer x" 2>&1 | head -c 200; echo
          echo "cat rc=${PIPESTATUS[0]}"
