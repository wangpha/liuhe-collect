name: 诊断-图片可达性（临时）
on:
  workflow_dispatch:
jobs:
  diag:
    name: "测源站实时可达率"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: 测 53040qq.com 20 次（真实图片）
        run: |
          set -u
          URLS="
          https://www43fdsafe3e32fdsafdsaf.53040qq.com/posts_singapore/1544731/1795442023597_716_1452_.png
          https://www43fdsafe3e32fdsafdsaf.53040qq.com/posts_singapore/1544668/1795441554542_1224_1313_.png
          https://www43fdsafe3e32fdsafdsaf.53040qq.com/posts_singapore/1544773/1795443223123_1080_1452_.png
          "
          OK=0; E522=0; OTHER=0
          for round in 1 2 3 4 5 6 7; do
            for U in $URLS; do
              [ -z "$U" ] && continue
              CODE=$(curl -sS -o /dev/null -A "Mozilla/5.0" -w "%{http_code}" --max-time 25 "$U" 2>/dev/null || echo "000")
              case "$CODE" in
                200) OK=$((OK+1)) ;;
                522) E522=$((E522+1)) ;;
                *)   OTHER=$((OTHER+1)); echo "  其他: $CODE" ;;
              esac
            done
          done
          echo "=== 结果 ==="
          echo "200: $OK / 522: $E522 / 其他: $OTHER"
          echo "总: $((OK + E522 + OTHER))"
      - name: 测 CF-RAY 节点
        run: |
          U="https://www43fdsafe3e32fdsafdsaf.53040qq.com/posts_singapore/1544731/1795442023597_716_1452_.png"
          curl -sS -o /dev/null -D - --max-time 25 "$U" 2>&1 | grep -Ei "cf-ray|cf-cache-status|HTTP/" | head -5
