  # ---------------- Job 13：推送到私有数据仓 ----------------
  publish:
    name: "Job13 publish 推数据仓"
    needs: [merge_dahkg, merge_aocai, merge_tuku]
    if: always() && !cancelled() && github.event.inputs.dry_publish != 'true' && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: repo
      - name: 检出私有数据仓
        uses: actions/checkout@v4
        with:
          repository: wangpha/liuhe-data
          token: ${{ secrets.LIUHE_DATA_TOKEN }}
          path: repo/work/store
      - name: 下载各源产物
        uses: actions/download-artifact@v4
        with:
          pattern: products-*-${{ github.run_id }}
          path: repo/work/incoming
      - name: 下载各源运行日志与审计
        uses: actions/download-artifact@v4
        with:
          pattern: run-*-${{ github.run_id }}
          path: repo/work/incoming-logs
      - name: 合并进数据仓 + 生成 manifest
        working-directory: repo
        run: |
          python - <<'PY'
          import json, shutil, sys
          from pathlib import Path
          from datetime import datetime, timezone

          incoming = Path("work/incoming")
          store = Path("work/store")
          data = store / "data"
          data.mkdir(parents=True, exist_ok=True)
          NAME_MAP = {"大港澳": "dahkg", "澳彩交流": "aocai", "tuku": "tuku"}

          def key_for(artifact_name, period_dir):
              parts = artifact_name.split("-")
              if len(parts) >= 2 and parts[1] in ("dahkg", "aocai", "tuku"):
                  return parts[1]
              return NAME_MAP.get(period_dir.parent.name, period_dir.parent.name or "unknown")

          copied = []
          for src_root in sorted(incoming.glob("products-*")):
              if not src_root.is_dir():
                  continue
              found = [p for p in src_root.rglob("*期") if p.is_dir() and (p / "posts.json").exists()]
              skipped = [p for p in src_root.rglob("*期") if p.is_dir() and not (p / "posts.json").exists()]
              print(f"{src_root.name}: 正式期目录 {len(found)} 个 -> {[p.name for p in found][:5]}")
              if skipped:
                  print(f"{src_root.name}: 跳过非产物目录 {len(skipped)} 个")
              for period_dir in found:
                  key = key_for(src_root.name, period_dir)
                  dst = data / key / period_dir.name
                  if dst.exists():
                      shutil.rmtree(dst)
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copytree(period_dir, dst, ignore=shutil.ignore_patterns("images", ".cache"))
                  copied.append(f"{key}/{period_dir.name}")

          if not copied:
              print("FATAL: 没有把任何一期的产物合并进数据仓", file=sys.stderr)
              sys.exit(1)

          manifest = {}
          for key_dir in sorted(p for p in data.iterdir() if p.is_dir()):
              periods = sorted((p for p in key_dir.iterdir() if p.is_dir()),
                               key=lambda p: int(''.join(c for c in p.name.split('_')[-1] if c.isdigit()) or 0))
              manifest[key_dir.name] = {
                  "periods": [p.name for p in periods],
                  "count": len(periods),
                  "files": {p.name: sum(1 for f in p.rglob('*') if f.is_file()) for p in periods},
              }
          (store / "manifest.json").write_text(
              json.dumps({"generatedAt": datetime.now(timezone.utc).isoformat(), "sources": manifest},
                         ensure_ascii=False, indent=2), encoding="utf-8")
          print("copied:", copied)
          print("manifest:", {k: v["count"] for k, v in manifest.items()})
          PY
      - name: 保存日志到数据仓（保留最近 30 份）
        working-directory: repo
        run: |
          mkdir -p work/store/logs
          FOUND=0
          for f in $(find work/incoming work/incoming-logs -name 'run_*.log' -type f 2>/dev/null); do
            ts=$(date -u +%Y%m%d_%H%M%S); base=$(basename "$f" .log)
            cp "$f" "work/store/logs/${base}_${ts}_run${GITHUB_RUN_NUMBER}.log"; FOUND=$((FOUND+1))
          done
          for j in $(find work/incoming-logs -name 'audit_*.json' -o -name 'logaudit_*.json' 2>/dev/null | head -40); do
            cp "$j" "work/store/logs/" 2>/dev/null || true
          done
          echo "拷入日志 $FOUND 份"
          ls -1t work/store/logs/*.log 2>/dev/null | tail -n +31 | xargs -r rm -f
      - name: 提交并推送
        working-directory: repo/work/store
        run: |
          git config user.name  "liuhe-bot"
          git config user.email "liuhe-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "无变化"; exit 0; fi
          git commit -m "data: 云端采集(分片) $(date -u +%Y-%m-%dT%H:%M:%SZ) run#${{ github.run_number }}"
          git push
      - name: 上传合并结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ github.run_id }}
          path: repo/work/store/manifest.json
          if-no-files-found: warn
