name: OCR 线程数真机基准测试

on:
  workflow_dispatch:
    inputs:
      note:
        description: '备注'
        required: false
        default: '测 4/8 线程在真实 runner 上的表现'

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 输出真实机器信息
        run: |
          echo "===== CPU ====="
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Core|MHz' || true
          echo ""
          echo "===== 内存 ====="
          free -h
          echo ""
          echo "===== 磁盘 ====="
          df -h / | tail -1
          echo ""
          echo "===== cgroup 配额（看是否被限流）====="
          cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo "无 cgroup v2 cpu.max"
          cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us 2>/dev/null || true

      - uses: actions/setup-python@v5
        with:
          # 必须与 cloud/core/*.pyc 的编译版本一致。
          # .pyc 的 magic 是 f30d0d0a → Python 3.13（本机 3.13.12 编译的）。
          # 用 3.11 会报 "bad magic number in 'core.ocr'"。
          python-version: '3.13'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip -q
          pip install -q rapidocr_onnxruntime==1.3.24 onnxruntime==1.19.2 \
                          opencv-python-headless pillow numpy psutil
          python -c "import rapidocr_onnxruntime, onnxruntime, cv2, psutil; print('deps ok')"

      - name: 跑线程基准
        env:
          QODE_OCR_DML: "0"
        run: |
          python bench_threads.py 2>&1 | tee bench.log
          echo "--- 退出码: $? ---"

      - name: 把结果提交回仓库（避免依赖 artifact API）
        if: always()
        run: |
          mkdir -p bench_out
          cp -f bench.log bench_out/bench_${{ github.run_id }}.log 2>/dev/null || true
          cp -f bench_result.json bench_out/result_${{ github.run_id }}.json 2>/dev/null || true
          cp -f /tmp/lscpu.txt bench_out/ 2>/dev/null || lscpu > bench_out/lscpu_${{ github.run_id }}.txt
          free -h > bench_out/mem_${{ github.run_id }}.txt
          git config user.name "bench-bot"
          git config user.email "bench@local"
          git add bench_out
          git commit -m "bench: run ${{ github.run_id }}" || echo "无变化"
          git push || echo "push 失败（继续）"
