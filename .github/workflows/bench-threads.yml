name: OCR 线程数真机基准测试

on:
  workflow_dispatch:
    inputs:
      note:
        description: '备注'
        required: false
        default: '测 4/8 线程在真实 runner 上的表现'

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 输出真实机器信息
        run: |
          echo "===== CPU ====="
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Core|MHz' || true
          echo ""
          echo "===== 内存 ====="
          free -h
          echo ""
          echo "===== 磁盘 ====="
          df -h / | tail -1
          echo ""
          echo "===== 是否被限流（cgroup）====="
          cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo "无 cgroup v2 cpu.max"
          cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us 2>/dev/null || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip -q
          pip install -q rapidocr_onnxruntime==1.3.24 onnxruntime==1.19.2 \
                          opencv-python-headless pillow numpy psutil
          python -c "import rapidocr_onnxruntime, onnxruntime, cv2, psutil; print('deps ok')"

      - name: 跑线程基准
        env:
          QODE_OCR_DML: "0"
        run: |
          python bench_threads.py 2>&1 | tee bench.log

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-result-${{ github.run_id }}
          path: |
            bench.log
            bench_result.json
          if-no-files-found: warn
