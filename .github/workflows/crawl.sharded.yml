name: 六合云端采集

# 门禁纪律（文档 6B.5）：Gate 1–5 全部 ✅ 之前，schedule 段保持注释，只允许手动触发。
#
# 分片架构（v2，2026-11-16 改）：
#   plan(每源) → cleanup → shard ×10(并行预热 OCR 缓存) → merge(每源一次完整跑) → publish
#
# 为什么这样分：
#   `--run` 与 `--shard` 在 runner 的 argparse 里是互斥组（实测：--run --shard →
#   "argument --shard: not allowed with argument --run"，退出码 2）。
#   为了**不改 runner.py**，分片 job 走 `--shard i --shards 10`（只预热缓存），
#   再由 merge job 走 `--merge`（缓存全命中后跑完整流程，产出与串行版同源同流程）。
#   每个 shard job 把 `.cache/ocr` 打包上传，merge 全部解包后再跑。

on:
  workflow_dispatch:
    inputs:
      source:
        description: "采集哪个源"
        required: true
        default: "tuku"
        type: choice
        options: [tuku, aocai, dahkg, all]
      shards:
        description: "分片数（1 = 不分片；大港澳建议 10）"
        required: false
        default: "10"
      no_ocr:
        description: "跳过 OCR（只抓数据，验链路用）"
        required: false
        default: false
        type: boolean
      no_images:
        description: "跳过图片下载"
        required: false
        default: false
        type: boolean
      limit:
        description: "仅抓前 N 条（0 = 全量）"
        required: false
        default: "0"
      dry_publish:
        description: "只跑不推送数据仓"
        required: false
        default: false
        type: boolean

  # ⚠️ 生产定时任务：Gate 1–5 + 最终日志审计全部通过后再解注释
  # schedule:
  #   - cron: '30 8 * * *'    # 16:30 北京时间
  #   - cron: '30 10 * * *'   # 18:30
  #   - cron: '30 12 * * *'   # 20:30
  #   - cron: '0 15 * * *'    # 23:00 收齐当天

concurrency:
  group: crawl-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  # ---------------- JobP：决定跑哪些源 + 分片数 ----------------
  plan:
    name: "JobP 计划"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sources: ${{ steps.pick.outputs.sources }}
      shards: ${{ steps.pick.outputs.shards }}
      shard_count: ${{ steps.pick.outputs.shard_count }}
    steps:
      - name: 计算源列表与分片
        id: pick
        env:
          REQ: ${{ github.event.inputs.source || 'tuku' }}
          SHARDS: ${{ github.event.inputs.shards || '10' }}
        run: |
          echo "请求源: $REQ  分片数: $SHARDS"
          case "$REQ" in
            all) echo 'sources=["tuku","aocai","dahkg"]' >> "$GITHUB_OUTPUT" ;;
            tuku|aocai|dahkg) echo "sources=[\"$REQ\"]" >> "$GITHUB_OUTPUT" ;;
            *) echo "未知源: $REQ" >&2; exit 2 ;;
          esac
          # 分片号生成 [0..N-1]
          python - "$SHARDS" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          n = max(1, int(sys.argv[1]))
          print("shards=" + json.dumps(list(range(n))))
          print("shard_count=" + str(n))
          PY
          cat "$GITHUB_OUTPUT"

  # ---------------- Job 0：清理（图片 2 天轮转 + 产物 30 期轮转）----------------
  cleanup:
    name: "Job0 cleanup 轮转"
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: repo

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 检出私有数据仓
        uses: actions/checkout@v4
        with:
          repository: wangpha/liuhe-data
          token: ${{ secrets.LIUHE_DATA_TOKEN }}
          path: repo/work/store

      - name: 清理轮转（图片 2 天 / 产物 30 期）
        working-directory: repo
        run: |
          set -o pipefail
          python -m cloud.runner --cleanup \
            --work work \
            --store work/store \
            --keep-days 2 \
            --keep-periods 30 2>&1 | tee work/cleanup.log

      - name: 提交轮转结果
        working-directory: repo/work/store
        run: |
          git config user.name  "liuhe-bot"
          git config user.email "liuhe-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化，不提交"
          else
            git commit -m "cleanup: 图片2天/产物30期轮转 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: 保存清理日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-log-${{ github.run_id }}
          path: repo/work/cleanup.log
          if-no-files-found: warn

  # ---------------- Job 1：逐源 plan（期号四重校验 + 独立扫描基线）----------------
  prepare:
    name: "计划 ${{ matrix.source }}"
    needs: [plan, cleanup]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.sources) }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: repo

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 检出私有数据仓（读状态）
        uses: actions/checkout@v4
        with:
          repository: wangpha/liuhe-data
          token: ${{ secrets.LIUHE_DATA_TOKEN }}
          path: repo/work/store

      - name: 安装依赖
        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cloud/requirements.txt

      - name: 生成 plan（含期号校验证据）
        working-directory: repo
        run: |
          set -o pipefail
          python -m cloud.runner --plan \
            --source "${{ matrix.source }}" \
            --work work \
            --state work/store/state 2>&1 | tee "work/plan_${{ matrix.source }}.log"

      - name: 上传 plan
        uses: actions/upload-artifact@v4
        with:
          name: plans-${{ matrix.source }}-${{ github.run_id }}
          path: |
            repo/work/plan
            repo/work/plan_${{ matrix.source }}.log
          if-no-files-found: error

  # ---------------- Job 2~11：分片预热（matrix source × shard）----------------
  #
  # ⚠️ 只对大港澳分片（实测约束，2026-11-16）：
  #   runner 的 `--shard` 有两条硬门槛，都在 runner.py 里（本次约定不改 runner.py）：
  #     L247 `if not period: raise SystemExit("plan 里没有期号，无法分片")`
  #          —— do_plan 只对大港澳探测期号，tuku/aocai 的 plan.period 恒为 0
  #     L249 `if source != "dahkg": raise SystemExit("分片目前只对大港澳实现")`
  #   所以 tuku/aocai 的 shard job 直接跳过（skipped 不计费），由 merge job 完整跑。
  #   大港澳是唯一的长尾（冷缓存 OCR 数千张），10 片并行正是给它提速。
  shard:
    name: "分片 ${{ matrix.source }}#${{ matrix.shard }}"
    needs: [plan, cleanup, prepare]
    if: matrix.source == 'dahkg'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.sources) }}
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: repo

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装系统依赖（opencv 需要 libGL）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: 恢复 pip 缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('repo/cloud/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: 安装依赖
        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cloud/requirements.txt
          python -c "import rapidocr_onnxruntime, onnxruntime, cv2, openpyxl, Crypto; print('deps ok', onnxruntime.__version__, cv2.__version__)"

      - name: 下载本源的 plan
        uses: actions/download-artifact@v4
        with:
          name: plans-${{ matrix.source }}-${{ github.run_id }}
          path: repo/work/plan-dl

      - name: 归位 plan
        working-directory: repo
        run: |
          mkdir -p work/plan
          cp -v work/plan-dl/plan/*.json work/plan/ 2>/dev/null || true
          # artifact 可能是 plan/ 目录本身被剥掉一层，两种层级都兜住
          find work/plan-dl -name 'plan_*.json' -exec cp -v {} work/plan/ \;
          ls -la work/plan

      - name: 恢复 OCR 缓存
        uses: actions/cache@v4
        with:
          path: repo/work/out
          key: ocr-v2-${{ matrix.source }}-${{ github.run_id }}-${{ matrix.shard }}
          restore-keys: |
            ocr-v2-${{ matrix.source }}-

      - name: 分片预热（本片负责的帖子：抓详情+回复+图片+OCR）
        id: shard
        working-directory: repo
        env:
          NO_OCR: ${{ github.event.inputs.no_ocr || 'false' }}
          NO_IMAGES: ${{ github.event.inputs.no_images || 'false' }}
        run: |
          set -o pipefail
          EXTRA=""
          [ "$NO_OCR" = "true" ] && EXTRA="$EXTRA --no-ocr"
          [ "$NO_IMAGES" = "true" ] && EXTRA="$EXTRA --no-images"
          python -m cloud.runner --shard "${{ matrix.shard }}" \
            --shards "${{ needs.plan.outputs.shard_count }}" \
            --source "${{ matrix.source }}" \
            --work work \
            --out work/out \
            --workers 4 \
            $EXTRA 2>&1 | tee "work/shard_${{ matrix.source }}_${{ matrix.shard }}.log"

      - name: 打包本片 OCR 缓存
        if: always()
        working-directory: repo
        run: |
          mkdir -p work/cacheout
          ( cd work/out && find . -type d -name .cache -print0 2>/dev/null \
            | tar -czf ../../work/cacheout/cache_${{ matrix.source }}_${{ matrix.shard }}.tar.gz \
              --null -T - 2>/dev/null ) || echo "没有 .cache 可打包（本片可能是空片）"
          ls -la work/cacheout

      - name: 上传本片缓存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-${{ matrix.source }}-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            repo/work/cacheout
            repo/work/shard_${{ matrix.source }}_${{ matrix.shard }}.log
          if-no-files-found: warn

  # ---------------- Job 12：合并缓存 + 完整跑一次（产出与串行版一致）----------------
  merge:
    name: "合并 ${{ matrix.source }}"
    needs: [plan, prepare, shard]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.sources) }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: repo

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 检出私有数据仓（读状态：期号/快照）
        uses: actions/checkout@v4
        with:
          repository: wangpha/liuhe-data
          token: ${{ secrets.LIUHE_DATA_TOKEN }}
          path: repo/work/store

      - name: 安装系统依赖（opencv 需要 libGL）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: 恢复 pip 缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('repo/cloud/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: 安装依赖
        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cloud/requirements.txt

      - name: 下载各分片缓存
        uses: actions/download-artifact@v4
        with:
          pattern: cache-${{ matrix.source }}-*-${{ github.run_id }}
          path: repo/work/incoming-cache

      - name: 解开所有分片缓存到工作输出目录
        working-directory: repo
        run: |
          mkdir -p work/out
          n=0
          for f in $(find work/incoming-cache -name 'cache_*.tar.gz' -type f 2>/dev/null); do
            echo "解开 $f"
            tar -xzf "$f" -C work/out
            n=$((n+1))
          done
          echo "共解开 $n 份缓存"
          du -sh work/out 2>/dev/null || true
          find work/out -type d -name .cache | head -5

      - name: 恢复 OCR 缓存（actions/cache 兜底）
        uses: actions/cache@v4
        with:
          path: repo/work/out
          key: ocr-v2-${{ matrix.source }}-${{ github.run_id }}-merge
          restore-keys: |
            ocr-v2-${{ matrix.source }}-

      - name: 清理昨日图片（R2）
        working-directory: repo
        run: |
          set -o pipefail
          python -m cloud.runner --cleanup \
            --work work --out work/out --keep-days 2 --skip-periods 2>&1 | tee work/images_cleanup.log

      - name: 完整跑一次（缓存全命中）+ 五道防线校验
        id: merge
        working-directory: repo
        env:
          LIUHE_CLOUD_WORK: work
          NO_OCR: ${{ github.event.inputs.no_ocr || 'false' }}
          NO_IMAGES: ${{ github.event.inputs.no_images || 'false' }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: |
          set -o pipefail
          EXTRA=""
          [ "$NO_OCR" = "true" ] && EXTRA="$EXTRA --no-ocr"
          [ "$NO_IMAGES" = "true" ] && EXTRA="$EXTRA --no-images"
          [ "$LIMIT" != "0" ] && EXTRA="$EXTRA --limit $LIMIT"
          python -m cloud.runner --merge \
            --source "${{ matrix.source }}" \
            --work work \
            --out work/out \
            --state work/store/state \
            --workers 4 \
            $EXTRA 2>&1 | tee "work/run_${{ matrix.source }}.log"

      - name: 日志零错误审计（文档 6B.3 方式 1）
        if: always()
        working-directory: repo
        run: |
          LOG="work/run_${{ matrix.source }}.log"
          if [ -f "$LOG" ]; then
            python cloud/audit_logs.py "$LOG" --json "work/audit/logaudit_${{ matrix.source }}.json" || true
          fi

      - name: 汇总产物清单
        if: always()
        working-directory: repo
        run: |
          echo "=== 产物目录 ==="
          find work/out -maxdepth 3 -type d > work/_dirs.txt 2>/dev/null || true
          sed -n '1,40p' work/_dirs.txt
          echo "=== 每期文件数 ==="
          find work/out -maxdepth 3 -type d -name '*期' > work/_periods.txt 2>/dev/null || true
          while read -r d; do
            [ -n "$d" ] || continue
            echo "$d : $(find "$d" -maxdepth 1 -type f | wc -l) 个文件"
          done < work/_periods.txt
          du -sh work/out 2>/dev/null || true

      - name: 上传日志与审计证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ matrix.source }}-${{ github.run_id }}
          path: |
            repo/work/run_${{ matrix.source }}.log
            repo/work/audit
            repo/work/state
            repo/work/plan
            repo/work/images_cleanup.log
          if-no-files-found: warn

      - name: 上传产物（数据类，不含图片）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: products-${{ matrix.source }}-${{ github.run_id }}
          path: |
            repo/work/out
            !repo/work/out/**/images/**
          if-no-files-found: warn

  # ---------------- Job 13：推送到私有数据仓 ----------------
  publish:
    name: "Job13 publish 推数据仓"
    needs: merge
    if: always() && !cancelled() && needs.merge.result == 'success' && github.event.inputs.dry_publish != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: repo

      - name: 检出私有数据仓
        uses: actions/checkout@v4
        with:
          repository: wangpha/liuhe-data
          token: ${{ secrets.LIUHE_DATA_TOKEN }}
          path: repo/work/store

      - name: 下载各源产物
        uses: actions/download-artifact@v4
        with:
          pattern: products-*-${{ github.run_id }}
          path: repo/work/incoming

      - name: 下载各源运行日志与审计
        uses: actions/download-artifact@v4
        with:
          pattern: run-*-${{ github.run_id }}
          path: repo/work/incoming-logs

      - name: 合并进数据仓 + 生成 manifest
        working-directory: repo
        run: |
          python - <<'PY'
          import json, shutil, sys
          from pathlib import Path
          from datetime import datetime, timezone

          incoming = Path("work/incoming")
          store = Path("work/store")
          data = store / "data"
          data.mkdir(parents=True, exist_ok=True)

          NAME_MAP = {"大港澳": "dahkg", "澳彩交流": "aocai", "tuku": "tuku"}

          def key_for(artifact_name: str, period_dir: Path) -> str:
              parts = artifact_name.split("-")
              if len(parts) >= 2 and parts[1] in ("dahkg", "aocai", "tuku"):
                  return parts[1]
              return NAME_MAP.get(period_dir.parent.name, period_dir.parent.name or "unknown")

          copied = []
          for src_root in sorted(incoming.glob("products-*")):
              if not src_root.is_dir():
                  continue
              found = [p for p in src_root.rglob("*期") if p.is_dir() and (p / "posts.json").exists()]
              skipped = [p for p in src_root.rglob("*期") if p.is_dir() and not (p / "posts.json").exists()]
              print(f"{src_root.name}: 正式期目录 {len(found)} 个 -> {[p.name for p in found][:5]}")
              if skipped:
                  print(f"{src_root.name}: 跳过非产物目录 {len(skipped)} 个")
              for period_dir in found:
                  key = key_for(src_root.name, period_dir)
                  dst = data / key / period_dir.name
                  if dst.exists():
                      shutil.rmtree(dst)
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copytree(period_dir, dst, ignore=shutil.ignore_patterns("images", ".cache"))
                  copied.append(f"{key}/{period_dir.name}")

          if not copied:
              print("FATAL: 没有把任何一期的产物合并进数据仓", file=sys.stderr)
              for p in sorted(incoming.rglob("*"))[:60]:
                  print("   ", p, file=sys.stderr)
              sys.exit(1)

          manifest = {}
          for key_dir in sorted(p for p in data.iterdir() if p.is_dir()):
              periods = sorted((p for p in key_dir.iterdir() if p.is_dir()),
                               key=lambda p: int(''.join(c for c in p.name.split('_')[-1] if c.isdigit()) or 0))
              manifest[key_dir.name] = {
                  "periods": [p.name for p in periods],
                  "count": len(periods),
                  "files": {p.name: sum(1 for f in p.rglob('*') if f.is_file()) for p in periods},
              }
          (store / "manifest.json").write_text(
              json.dumps({"generatedAt": datetime.now(timezone.utc).isoformat(), "sources": manifest},
                         ensure_ascii=False, indent=2), encoding="utf-8")
          print("copied:", copied)
          print("manifest:", {k: v["count"] for k, v in manifest.items()})
          PY

      - name: 保存日志到数据仓（保留最近 30 份）
        working-directory: repo
        run: |
          mkdir -p work/store/logs
          FOUND=0
          for f in $(find work/incoming work/incoming-logs -name 'run_*.log' -type f 2>/dev/null); do
            ts=$(date -u +%Y%m%d_%H%M%S)
            base=$(basename "$f" .log)
            cp "$f" "work/store/logs/${base}_${ts}_run${GITHUB_RUN_NUMBER}.log"
            FOUND=$((FOUND+1))
          done
          for j in $(find work/incoming-logs -name 'audit_*.json' -o -name 'logaudit_*.json' 2>/dev/null | head -40); do
            cp "$j" "work/store/logs/" 2>/dev/null || true
          done
          echo "拷入日志 $FOUND 份"
          ls -la work/store/logs | tail -10
          ls -1t work/store/logs/*.log 2>/dev/null | tail -n +31 | xargs -r rm -f
          echo "保留 $(ls -1 work/store/logs/*.log 2>/dev/null | wc -l) 份"

      - name: 提交并推送
        working-directory: repo/work/store
        run: |
          git config user.name  "liuhe-bot"
          git config user.email "liuhe-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "data: 云端采集(分片) $(date -u +%Y-%m-%dT%H:%M:%SZ) run#${{ github.run_number }}"
          git push

      - name: 上传合并结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ github.run_id }}
          path: repo/work/store/manifest.json
          if-no-files-found: warn

