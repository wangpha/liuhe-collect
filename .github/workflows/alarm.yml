name: 六合定时闹钟

# ============================================================================
# 为什么需要这个 workflow
# ============================================================================
# GitHub 自己的 `schedule` 是**尽力而为**的，官方文档明确写：
#   "The schedule event can be delayed during periods of high loads.
#    High load times include the start of every hour.
#    If the load is sufficiently high enough, some queued jobs may be dropped."
#
# 本仓库实测（11-20 ~ 11-22）：11 次 schedule 触发，只有 1 次落在目标分钟数（9%），
# 间隔从 32 分钟到 941 分钟（15.7 小时）完全随机。
#
# 所以用这个「闹钟」workflow 替代：
#   · 一个 job 跑满近 6 小时（GitHub 单 job 上限 6 小时）
#   · 每 20 秒轮询北京时间，到档位就调 workflow_dispatch API 触发主流程
#   · 精度 ±20 秒（远好于 cron 的几分钟到几小时）
#   · 每 6 小时用 schedule 兜底重启一次，链不会断
#   · 完全云端，不依赖本地电脑，免费（公开仓库 Actions 无限）
#
# 与主流程的关系：
#   · 闹钟是「准点触发器」，主流程 crawl.yml 是「干活的人」
#   · 主流程自己的 cron 仍保留（每 5 分钟），作为闹钟失效时的兜底
#   · 两者都调 gate 判断，重复触发会被 gate 的「查在跑 run」拦住
# ============================================================================

on:
  # 手动启动一次（第一次部署后手动跑一次，链就接上了）
  # test_slot / test_minutes：自测用。填了 test_slot 时闹钟只用那个时刻做档位，
  #   不改生产逻辑（留空 = 正常五档 + 349 分钟）。
  workflow_dispatch:
    inputs:
      test_slot:
        description: "自测档位 HH:MM（留空 = 正常五档）"
        required: false
        default: ""
      test_minutes:
        description: "自测运行分钟数（留空 = 349）"
        required: false
        default: ""
  # 每 6 小时兜底重启（万一上一条链被取消/超时）
  # ⚠ 注意：GitHub cron 一律是 UTC，不是北京时间！
  #   UTC 00/03/06/09/12/15/18/21 :07
  #   = 北京 08:07 / 11:07 / 14:07 / 17:07 / 20:07 / 23:07 / 02:07 / 05:07
  #
  # ⚠ 2026-11-23 第二次修正（今天实测暴露「空档」问题）：
  #   原来 schedule 每 6 小时一次、实例跑 349 分钟（5h49m），两者几乎相等 →
  #   任何一个实例提前退出（cancel / 出错 / GitHub 抢占），都要等最长 6 小时
  #   才有下一个接上 → 空档可达数小时。
  #   实测：我 cancel 生产闹钟后，下一个要等 14:07，12:00 档差点漏掉。
  #
  #   现在：schedule 每 3 小时一次，实例跑 170 分钟（2h50m）：
  #     北京 02:07 → 04:57
  #     北京 05:07 → 07:57
  #     北京 08:07 → 10:57
  #     北京 11:07 → 13:57  ← 覆盖 12:00 ✅
  #     北京 14:07 → 16:57  ← 覆盖 15:00 ✅
  #     北京 17:07 → 19:57  ← 覆盖 18:00 ✅
  #     北京 20:07 → 22:57  ← 覆盖 20:10、20:40 ✅
  #     北京 23:07 → 01:57
  #   相邻窗口间隙仅 10 分钟，且这 10 分钟无档位。
  #   任何实例提前死，最多等 3 小时就有下一个（原来是 6 小时）。
  schedule:
    - cron: '7 0,3,6,9,12,15,18,21 * * *'

# 同一时间只跑一个「生产闹钟」。
# ⚠ 2026-11-23 修正（自测 run 45078940835 卡在 pending 发现）：
#   原来 group 固定 'alarm'，导致自测实例永远排队进不来。
#   现在：自测实例（test_slot 非空）用独立 group，互不阻塞。
#   生产实例仍共用 'alarm'，保证同时只有一个（防重复触发）。
concurrency:
  group: alarm-${{ github.event.inputs.test_slot || 'prod' }}
  cancel-in-progress: false

permissions:
  actions: write        # 调 workflow_dispatch API 需要
  contents: read

jobs:
  alarm:
    name: "闹钟（每 20 秒轮询档位）"
    runs-on: ubuntu-24.04
    # GitHub 单 job 上限 6 小时 = 360 分钟；留 10 分钟余量避免被强杀
    timeout-minutes: 180   # 略大于 RUN_MIN=170，留 10 分钟余量

    steps:
      - name: 检查是否已有闹钟在跑（防重复）
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # ⚠ 2026-11-23 修正（自测 run 45079348715 实测）：自测模式跳过防重复检查。
          #   原来自测实例查到生产闹钟在跑 → 主动退出，自测永远跑不起来。
          TEST_SLOT="${{ github.event.inputs.test_slot }}"
          if [ -n "$TEST_SLOT" ]; then
            echo "⚠ 自测模式（档位=$TEST_SLOT）→ 跳过防重复检查"
            echo "should_start=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 查有没有别的「六合定时闹钟」workflow 正在跑（排除自己）
          RUNNING=$(curl -sS --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/alarm.yml/runs?status=in_progress&per_page=20" \
            2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);s=[r for r in (d.get('workflow_runs') or []) if str(r.get('id'))!='$GITHUB_RUN_ID'];print(len(s))" 2>/dev/null || echo "-1")
          echo "其他在跑的闹钟数 = ${RUNNING}"
          if [ "$RUNNING" = "-1" ]; then
            echo "⚠ 查不到（API 失败），继续启动"
            echo "should_start=1" >> "$GITHUB_OUTPUT"
          elif [ "$RUNNING" -gt 0 ]; then
            echo "⏭ 已有 $RUNNING 个闹钟在跑 → 本实例退出（不重复）"
            echo "should_start=0" >> "$GITHUB_OUTPUT"
          else
            echo "✅ 无其他闹钟，启动本实例"
            echo "should_start=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 闹钟主循环（每 20 秒查一次档位）
        if: steps.check.outputs.should_start == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          # 五档：12:00 / 15:00 / 18:00 / 20:10 / 20:40
          # 只在「该分钟的第 0-19 秒」触发，保证每档只触发一次
          SLOTS="12:00 15:00 18:00 20:10 20:40"
          # 自测模式：test_slot 非空时只用它做档位，运行分钟数也缩短
          TEST_SLOT="${{ github.event.inputs.test_slot }}"
          TEST_MIN="${{ github.event.inputs.test_minutes }}"
          if [ -n "$TEST_SLOT" ]; then
            SLOTS="$TEST_SLOT"
            RUN_MIN="${TEST_MIN:-5}"
            echo "⚠ 自测模式：档位=$TEST_SLOT，运行 $RUN_MIN 分钟"
          else
            RUN_MIN=170   # 2026-11-23：349→170（配合 3 小时一次 schedule，缩短空档）
          fi
          END=$(( $(date +%s) + RUN_MIN*60 ))   # 正常 170 分钟（略小于 timeout 180）
          FIRED=""                          # 已触发的档位（本 job 内去重）
          ROUND=0

          echo "闹钟启动：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          echo "结束时间：$(TZ=Asia/Shanghai date -d "@$END" '+%Y-%m-%d %H:%M:%S' 2>/dev/null || echo '?')"
          echo "档位：$SLOTS"
          echo "--------------------------------------------------------"

          while [ "$(date +%s)" -lt "$END" ]; do
            ROUND=$((ROUND + 1))
            BJ=$(TZ=Asia/Shanghai date '+%H:%M')
            BJS=$(TZ=Asia/Shanghai date '+%S')
            BJYMD=$(TZ=Asia/Shanghai date '+%Y-%m-%d')

            for S in $SLOTS; do
              if [ "$BJ" = "$S" ] && [ "$(echo $BJS | sed 's/^0*//')" -lt 20 ] 2>/dev/null; then
                KEY="${BJYMD}T${S}"
                # 本 job 内去重
                case " $FIRED " in
                  *" $KEY "*) ;;
                  *)
                    echo "[$(TZ=Asia/Shanghai date '+%H:%M:%S')] 🎯 命中档位 $S → 触发主流程"
                    CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 40 \
                      -X POST \
                      -H "Authorization: Bearer $GH_TOKEN" \
                      -H "Accept: application/vnd.github+json" \
                      -H "Content-Type: application/json" \
                      "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/crawl.yml/dispatches" \
                      -d "{\"ref\":\"main\",\"inputs\":{\"source\":\"all\"}}" 2>/dev/null || echo "000")
                    echo "    HTTP $CODE $([ "$CODE" = "204" ] && echo '✅ 已触发' || echo '⚠ 触发失败')"
                    FIRED="$FIRED $KEY"
                    ;;
                esac
              fi
            done

            # 每 30 轮（10 分钟）打一次心跳，避免日志被截断看不出还活着
            if [ $((ROUND % 30)) -eq 0 ]; then
              echo "[心跳 $(TZ=Asia/Shanghai date '+%H:%M:%S')] 第 $ROUND 轮，已触发：${FIRED:- 无}"
            fi

            sleep 20
          done

          echo "--------------------------------------------------------"
          echo "闹钟到期退出：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          echo "本轮共触发档位：${FIRED:- 无}"
          # 到期后由下一个 schedule（每 6 小时）自动重启
